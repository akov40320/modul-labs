<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Модуль - локальный индекс лабораторных</title><style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#1e2b3d;background:#f3f6fb;--ink:#13233f;--blue:#2550c7;--line:#d8e1ee}*{box-sizing:border-box}body{margin:0}header{background:var(--ink);color:#fff;padding:28px 32px}header h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:#cfdbef}main{max-width:1450px;margin:auto;padding:24px 32px;display:grid;grid-template-columns:310px 1fr;gap:24px}.panel,.content{background:#fff;border:1px solid var(--line);border-radius:14px}.panel{padding:16px;align-self:start;position:sticky;top:18px}.panel h2{font-size:16px;margin:0 0 12px}.panel button{display:block;width:100%;border:0;text-align:left;background:#f2f5fb;color:#263b5b;margin:5px 0;padding:9px;border-radius:8px;cursor:pointer}.panel button.active{background:#2550c7;color:#fff}.links{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.links a{display:block;color:var(--blue);font-size:13px;padding:4px 0;text-decoration:none}.content{padding:28px;min-height:700px}.content h1{font-size:26px;color:var(--ink);margin-top:0}.content h2{font-size:21px;color:var(--ink);margin-top:28px}.content h3{font-size:17px;color:var(--ink);margin-top:23px}.content p,.content li{line-height:1.55}.content code{background:#eef2f8;padding:2px 5px;border-radius:4px}.content pre{background:#172640;color:#e7edf7;padding:14px;border-radius:8px;overflow:auto}.content pre code{background:transparent;padding:0;color:inherit}.content a{color:var(--blue)}.status{font-size:13px;color:#5b6c82;margin-top:14px}@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}.panel{position:static}}</style></head><body><header><h1>«Модуль» - локальный индекс</h1><p>Лабораторные 1-6 · офлайн-просмотр Wiki и артефактов · внешние сервисы pending</p></header><main><aside class="panel"><h2>Wiki / Markdown</h2><div id="md-nav"></div><div class="links"><h2>Артефакты</h2><div id="artifact-nav"></div></div><p class="status">Выберите документ. Содержимое встроено в этот файл, сеть не нужна.</p></aside><article class="content" id="content"></article></main><script>const pages={"lab1/form-structure.md": "<h1>Структура формы «Получить коммерческое предложение»</h1><p>Статус: <strong>локальная спецификация, публикация pending</strong>.</p><h2>Порядок блоков</h2><p>1. <strong>Заголовок:</strong> «Получить коммерческое предложение».</p><p>2. <strong>Короткое пояснение:</strong> что запрос собирается для подбора B2B-набора, а не для оплаты.</p><p>3. <strong>Контакт:</strong> имя, компания, рабочий email, необязательный телефон.</p><p>4. <strong>Запрос:</strong> направление, набор, ориентировочное количество.</p><p>5. <strong>Контекст:</strong> комментарий о задаче, аудитории или сроках.</p><p>6. <strong>Согласие:</strong> подтверждение учебного режима и отказ от реальных персональных данных.</p><p>7. <strong>Кнопка:</strong> «Отправить запрос».</p><p>8. <strong>Результат:</strong> понятное сообщение о сохранении/ошибках.</p><p>Идентификаторы и ограничения полей приведены в <a href=\"lab1/form-spec.json\">form-spec.json</a>. В локальном приложении форма дополнительно показывает расчет партии и сохраняет запись в браузере.</p><h2>Критерии формы</h2><ul><li>обязательность обозначена до отправки;</li><li>неверный email не принимается;</li><li>количество проверяется как целое положительное число;</li><li>состояние ошибки привязано к конкретному полю;</li><li>сообщение после отправки не обещает реального звонка или письма;</li><li>в учебной версии не вводятся настоящие персональные данные.</li></ul>", "lab1/prompts.md": "<h1>ЛР1 - заготовки промптов для Алисы AI</h1><p>Выбранный вариант из PDF: <strong>(Ф) «Получить коммерческое предложение»</strong>. Промпты ниже подготовлены для проектирования B2B-формы «Модуль». Они являются заготовками: <strong>в Алису AI не отправлялись</strong>, результат генерации не выдаётся за фактический.</p><h2>1. Аудитория и задача</h2><pre><code>Ты продуктовый аналитик. Для учебного B2B-лендинга «Модуль» опиши 3 сегмента аудитории, которые могут запросить коммерческое предложение на модульные наборы конструкторов: образовательные организации, корпоративные заказчики и розничные партнеры. Для каждого сегмента укажи задачу, сомнение перед заявкой, обязательные поля формы и один проверяемый сигнал интереса. Не придумывай реальные компании, контакты или статистику. Ответ дай таблицей.</code></pre><p><strong>Ожидаемый локальный результат:</strong> таблица аудитории для проверки полей формы.</p><h2>2. Структура одностраничного приложения</h2><pre><code>Ты UX-архитектор. Составь структуру статического B2B-лендинга «Модуль» для сценария «получить коммерческое предложение». Нужны якорные разделы: hero, о продукте, каталог, о компании, FAQ, контакты и форма заявки. Для каждого раздела укажи цель, один главный призыв к действию и связь со следующим шагом. Не добавляй оплату, доставку, личный кабинет или реальные интеграции.</code></pre><p><strong>Ожидаемый локальный результат:</strong> список блоков и переходов для wireframes.</p><h2>3. Тексты и тональность</h2><pre><code>Ты редактор B2B-лендинга. Напиши черновики на русском языке для «Модуль»: заголовок hero, подзаголовок, три преимущества, короткий текст о компании, три FAQ и текст кнопки формы «Получить коммерческое предложение». Тон спокойный и конкретный, без неподтвержденных цифр, обещаний поставки и упоминания официальной связи с LEGO. В каждом тексте помечай демонстрационные характеристики как учебные.</code></pre><p><strong>Ожидаемый локальный результат:</strong> тексты, которые можно проверить вручную перед добавлением в HTML.</p><h2>4. Поля формы</h2><pre><code>Ты специалист по UX-формам. Спроектируй форму «Получить коммерческое предложение» для B2B-каталога модульных конструкторов. Предложи обязательность и понятную подпись для полей: имя, компания, рабочий email, телефон (необязательно), направление, интересующий набор, количество, комментарий и согласие на сохранение учебной заявки. Добавь сообщения ошибок и правило: реальные персональные данные в учебной версии не вводятся.</code></pre><p><strong>Ожидаемый локальный результат:</strong> черновик схемы полей, совпадающий с <code>form-spec.json</code>.</p><h2>5. Проверка готового сценария</h2><pre><code>Ты QA-редактор. Проверь описание учебной формы «Получить коммерческое предложение» и список критериев приемки. Составь позитивные, граничные и ошибочные сценарии: пустые обязательные поля, неверный email, количество меньше минимальной партии, допустимая партия, повторное открытие страницы, экспорт и очистка localStorage. Для каждого сценария укажи Дано, Когда, Тогда. Не утверждай, что тесты реально выполнены.</code></pre><p><strong>Ожидаемый локальный результат:</strong> чек-лист для ручной проверки, а не отчет о фактическом запуске.</p>", "lab1/publication-instructions.md": "<h1>Инструкция публикации в Яндекс Формах</h1><p>Это <strong>план действий</strong>, а не подтверждение публикации. Учетная запись, организация и URL формы не предоставлены.</p><p>1. Войти в нужную организацию Яндекс 360 с реальным владельцем доступа.</p><p>2. Создать новую форму и назвать ее «Получить коммерческое предложение - Модуль».</p><p>3. Добавить поля в порядке из <code>form-spec.json</code>; обязательность и ограничения перенести вручную.</p><p>4. Добавить текст учебного режима и не запрашивать лишние персональные данные.</p><p>5. Настроить сообщение успешной отправки без обещания реальной обработки.</p><p>6. Провести пробную отправку только с вымышленными данными.</p><p>7. Проверить доступ по ссылке и права просмотра ответов.</p><p>8. Записать фактический URL в отчет только после реальной публикации.</p><p><strong>Текущий результат:</strong> внешний URL и скриншоты не созданы; значение <code>external_url</code> в JSON равно <code>null</code>.</p>", "lab2/tracker-setup-plan.md": "<h1>ЛР2 - план настройки внешнего рабочего пространства</h1><p>Статус: <strong>pending</strong>, действие во внешних сервисах не выполнялось.</p><p>1. Владелец доступа создает реальную организацию Яндекс 360.</p><p>2. Подключает Яндекс Трекер.</p><p>3. Вносит действительных участников, роли и адреса, затем отправляет приглашения.</p><p>4. После подтверждения проверяет доступ.</p><p>5. Создает очередь MOD по шаблону «Управление проектами».</p><p>6. Импортирует или переносит 4 эпика и 12 задач из <code>backlog.csv</code>, сохраняя обязательные поля.</p><p>7. Добавляет ссылки на реальные Wiki/макеты после их публикации.</p><p>8. Создает Kanban-доску с пятью колонками и WIP2.</p><p>Известный участник только А.А. Первых. Другие имена, контакты, подтвержденные приглашения и URL в локальном комплекте отсутствуют.</p>", "lab3/MVP-Scope.md": "<h1>ЛР3 - MVP Scope и трассировка</h1><p>Основная страница: <a href=\"wiki/MVP-Scope.md\">Wiki/MVP Scope</a>.</p><h2>Трассировка</h2><p>| User Story | Макет/User Flow | Задачи | Локальный результат |</p><p>|---|---|---|---|</p><p>| US-01 | <code>../design/wireframes.html</code>, <code>../design/user-flow.drawio</code> | MOD-101..103 | Витрина и якоря в project/app |</p><p>| US-02 | Wireframe каталога | MOD-201..202 | Фильтры и сортировка каталога |</p><p>| US-03 | Wireframe кабинета | MOD-203 | Учебный редактор |</p><p>| US-04 | Wireframe заявки | MOD-302 | Расчет партии |</p><p>| US-05 | User Flow: форма -&gt; сохранение | MOD-301..302 | Локальная валидация и сохранение |</p><p>| US-06 | Wireframe кабинета | MOD-303 | Просмотр/export/очистка |</p><h2>Контрольная точка MVP</h2><p>Учебная веха: «MVP заявки и каталога». Плановая дата 2026-10-10. Это план, а не утверждение о выполнении внешней командой.</p>", "lab4/sprint-plan.md": "<h1>ЛР4 - Kanban и план учебной работы</h1><h2>Методологии</h2><p><strong>Scrum</strong> работает итерациями фиксированной длины. У спринта есть цель, выбранный набор задач и даты начала/окончания; обычно команда планирует спринт, проводит ежедневные встречи, review и retrospective.</p><p><strong>Kanban</strong> организует непрерывный поток задач по колонкам. Работа не обязана ждать границ спринта, но ограничивается WIP: новую задачу не начинают, пока активная работа не завершена или не передана на проверку.</p><h2>Выбор</h2><p>Для локального MVP выбран <strong>Kanban</strong>: объем невелик, фактический состав команды не задан, а документы и демонстрационную витрину удобно завершать последовательно. В учебном комплекте существует плановый период, но он не называется фактически проведенным Scrum-спринтом.</p><h2>Колонки</h2><p>Бэклог -&gt; К выполнению -&gt; В работе -&gt; На проверке -&gt; Готово.</p><ul><li>общий WIP для «В работе»: **2**;</li><li>если работает один известный исполнитель: **личный WIP 1**;</li><li>перед взятием следующей задачи текущая должна перейти на проверку или в готово;</li><li>вернуть задачу из Review в In Progress можно с описанием проблемы и ожидаемого исправления.</li></ul><h2>Учебный план: 04-10 октября 2026</h2><p>Это план, а не отчет о фактически прошедших днях.</p><p>| Дата | Плановое действие | Результат для проверки |</p><p>|---|---|---|</p><p>| 04.10.2026 | Уточнить вариант, структуру и границы MVP | Docs Home, MVP Scope, backlog |</p><p>| 05.10.2026 | Завершить витрину и якорную навигацию | Hero, блоки, меню |</p><p>| 06.10.2026 | Проверить каталог, фильтры и карточки | Сценарий выбора набора |</p><p>| 07.10.2026 | Проверить заявку и расчет партии | Ошибки формы и локальная запись |</p><p>| 08.10.2026 | Проверить кабинет, экспорт, очистку и редактор | Локальные данные контролируются |</p><p>| 09.10.2026 | Провести lint/test/build и проверить макеты | Логи локальных проверок |</p><p>| 10.10.2026 | Сверить отчет и просмотреть MVP | Веха «MVP заявки и каталога» |</p><h2>Учебная веха</h2><p><strong>Название:</strong> MVP заявки и каталога. <strong>Плановая дата:</strong> 2026-10-10. <strong>Ожидаемая демонстрация:</strong> фильтрация набора -&gt; расчет партии -&gt; сохранение заявки -&gt; просмотр и экспорт. Веха не создана в Яндекс Трекере: remote pending.</p><h2>Текущий снимок локальной доски</h2><p>Файлы <code>../board.json</code> и <code>../board.html</code> содержат стартовый учебный снимок. Карточки, не имеющие реальной проверки приложения, помечены планом. Подготовленные документы MOD-401 и MOD-403 отмечены как созданные локально. Движение задач в течение семестра не утверждается и требует дальнейшего ведения.</p>", "lab5/Git-Workflow.md": "<h1>ЛР5 - модель ветвления и правила коммитов</h1><h2>Выбор модели</h2><p>Для небольшого статического MVP выбран <strong>GitHub Flow</strong>: защищенная <code>main</code> и короткоживущие feature-ветки. Реальный удаленный репозиторий пока не указан.</p><p>Имена веток:</p><ul><li>`feature/MOD-201-catalog-filters`;</li><li>`feature/MOD-301-request-form`;</li><li>`bugfix/MOD-302-quote-validation`.</li></ul><h2>Conventional Commits</h2><p>Допустимые типы: <code>feat:</code>, <code>fix:</code>, <code>docs:</code>, <code>style:</code>, <code>refactor:</code>, <code>test:</code>, <code>chore:</code>. Примеры:</p><ul><li>`feat: add catalog category filters`;</li><li>`fix: validate minimum batch size`;</li><li>`docs: describe local request storage`.</li></ul><h2>Процесс PR</h2><p>1. Создать ветку от актуальной <code>main</code>.</p><p>2. Сделать небольшие коммиты по одному смыслу.</p><p>3. Запустить локальные lint/test/build.</p><p>4. Открыть PR и дождаться CI.</p><p>5. После проверки объединить PR в <code>main</code>.</p><p>6. Удалить ветку.</p><p>Сценарий конфликта и реальный merge в удаленном репозитории <strong>не выполнены</strong>, так как remote pending. Конфликт можно симулировать на двух локальных ветках, не публикуя результат.</p>", "lab6/CI-CD-Plan.md": "<h1>ЛР6 - CI/CD план</h1><p>Цель: воспроизводимо проверить, собрать и затем доставить статическое приложение.</p><h2>Локальный минимум</h2><ul><li>`npm run lint`;</li><li>`npm test` (не менее трех базовых unit-проверок);</li><li>`npm run build`.</li></ul><p>Если команда отсутствует в текущем checkout, это отдельная задача подготовки проекта, а не доказательство успешного CI.</p><h2>Удаленная конфигурация</h2><p>Целевой файл: <code>.github/workflows/ci-cd.yml</code> в будущем удаленном репозитории. Пример шагов приведен в <code>лр6/CICD.pdf</code> и пересказан в <a href=\"wiki/CI-CD-Pipeline.md\">Wiki CI/CD</a>. Создание workflow, секретов и деплоя ожидает remote.</p><h2>Публичный URL</h2><p>Не задан. Не подставлять фиктивную ссылку в отчет.</p>", "README.md": "<h1>Локальный комплект материалов лабораторных работ</h1><p><a href=\"index.html\">Открыть offline-индекс</a></p><p>Проект: <strong>«Модуль» - учебный B2B-лендинг конструкторов</strong>.</p><p>Все файлы в этой папке подготовлены для локальной проверки и последующего переноса в нужные внешние сервисы. Внешняя организация Яндекс 360, Яндекс Трекер, Wiki, GitHub/GitLab, Яндекс Формы и публичный хостинг в этом комплекте не создавались. Там, где задание требует внешний URL, указано <code>pending</code> или «URL не задан».</p><h2>Навигация</h2><ul><li>[Выбор вариантов и требования](source-choices.md)</li><li>[Wiki: Home](wiki/Home.md)</li><li>[Wiki: Team](wiki/Team.md)</li><li>[Wiki: Glossary](wiki/Glossary.md)</li><li>[Wiki: Onboarding](wiki/Onboarding.md)</li><li>[Wiki: Decision Log](wiki/Decision-Log.md)</li><li>[Wiki: MVP Scope](wiki/MVP-Scope.md)</li><li>[CI/CD Pipeline](wiki/CI-CD-Pipeline.md)</li><li>[ЛР1: промпты Алисы](lab1/prompts.md)</li><li>[ЛР1: спецификация формы](lab1/form-spec.json)</li><li>[ЛР1: структура формы](lab1/form-structure.md)</li><li>[ЛР1: план публикации](lab1/publication-instructions.md)</li><li>[ЛР2: backlog](lab2/backlog.csv)</li><li>[ЛР3: MVP Scope и трассировка](lab3/MVP-Scope.md)</li><li>[ЛР4: локальная Kanban-доска](board.html)</li><li>[ЛР4: план работы](lab4/sprint-plan.md)</li><li>[ЛР5: Git Flow материалы](lab5/Git-Workflow.md)</li><li>[ЛР6: CI/CD план](lab6/CI-CD-Plan.md)</li><li>[User Flow (draw.io)](design/user-flow.drawio)</li><li>[Wireframes SVG](design/wireframes.svg)</li><li>[Wireframes HTML](design/wireframes.html)</li></ul><h2>Статусы</h2><ul><li>**Готово локально** - файл или локальная демонстрация создана и может быть проверена без внешнего аккаунта.</li><li>**Запланировано** - содержание подготовлено, но действие еще не выполнено.</li><li>**Ожидает внешнего шага** - нужен доступ к Яндекс 360/Трекеру/Forms или удаленному Git-репозиторию.</li></ul>", "source-choices.md": "<h1>Выбор вариантов и исходные требования</h1><h2>ЛР1 - выбранный вариант</h2><p>Точная формулировка из файла <code>лр1/Задания для 3ВТба.pdf</code>:</p><p>&gt; <strong>(Ф) «Получить коммерческое предложение».</strong></p><p>В локальном комплекте вариант реализован как спецификация формы для B2B-запроса по каталогам «Модуль». Реальная публикация в Яндекс Формах не выполнялась; подготовлены промпты, схема полей и инструкция.</p><h2>ЛР2 - выбранный вариант 4</h2><p>Точная формулировка из <code>лр2/569b2571c9daeea0e9ff85edb4b3f71a.docx</code>:</p><p>&gt; разработать одностраничный лендинг для B2B-продаж конструкторов в стиле LEGO. Включает дизайн с нуля, якорное меню, блоки (о продукте, пакеты услуг, о компании, FAQ, контакты), каталог товаров с фильтрами и админкой для редактирования, встраивание видео, форму заявки с интеграцией в CRM/почту, адаптивную верстку, базовое SEO и аналитику</p><p>В учебном MVP внешняя CRM/почта заменены на локальное сохранение заявок в <code>localStorage</code>. Реальные продажи, оплата, доставка и интеграция с LEGO отсутствуют.</p><h2>Обязательные поля задачи по методичке ЛР2</h2><p>Источник: <code>лр2/8a327fc4b2aeb86014e97577f69d0dac.docx</code>.</p><p>1. <strong>Детали задачи:</strong> тип, приоритет, метки, окружение, версия исправления.</p><p>2. <strong>Блокер/дефект:</strong> описание, предусловия, что случилось, шаги воспроизведения, фактический результат, ожидаемый результат, примечания.</p><p>3. <strong>Доработка:</strong> описание, User Story по форме «Как [роль], я хочу [действие], чтобы [ценность]».</p><p>4. <strong>Критерии приемки:</strong> проверяемые условия в формате «Дано + Когда + Тогда».</p><p>5. <strong>Дополнительные материалы:</strong> макеты/дизайн, API, аналоги, документация.</p><p>6. <strong>Нефункциональные требования:</strong> устройства (десктоп/мобильные/все) и изменения бэкенда/API.</p><p>7. <strong>Связи и подзадачи:</strong> связи с задачами; подзадачи для аналитики, бэкенда, фронтенда, тестирования, UX/UI, документации и DevOps с назначением исполнителя.</p><p>Файл <code>lab2/backlog.csv</code> повторяет эти поля для каждой записи. Для учебной локальной работы исполнителем указан только известный участник: А.А. Первых; остальные участники и контакты не заданы.</p>", "wiki/CI-CD-Pipeline.md": "<h1>CI/CD Pipeline - проектный план</h1><p>Статус: <strong>конфигурация и удаленная интеграция pending</strong>. Файл описывает целевой процесс и не утверждает, что удаленный запуск уже был выполнен.</p><h2>Предлагаемая платформа</h2><p>GitHub Actions для будущего GitHub-репозитория. До создания репозитория и секретов удаленный pipeline не запускается.</p><h2>Триггеры</h2><ul><li>`push` в `main` и `develop` - CI;</li><li>`pull_request` в `main` - CI;</li><li>push в `main` после успешного CI - условный CD.</li></ul><h2>Шаги CI</h2><p>1. Checkout.</p><p>2. Установка Node.js.</p><p>3. Установка зависимостей.</p><p>4. <code>npm run lint</code>.</p><p>5. <code>npm test</code> - минимум три проверки базовой логики.</p><p>6. <code>npm run build</code>.</p><h2>Шаги CD</h2><p>После CI можно подключить выбранный хостинг (например, статический хостинг) и секрет deploy token. До выбора хостинга URL и имя секрета не заданы. Секреты нельзя хранить в этом каталоге.</p><h2>Проверки ветки</h2><p>Для <code>main</code> планируется запрет прямого push и требование успешного CI перед merge. Настройка выполняется только владельцем реального репозитория.</p><h2>Доказательства</h2><p>Для отчета после реального подключения потребуются скриншоты: защита ветки, неуспешный PR, успешный PR, workflow с CI/CD и публичная страница. В текущем локальном комплекте таких скриншотов и URL нет.</p>", "wiki/Decision-Log.md": "<h1>Decision Log - журнал решений</h1><p>| ID | Дата | Решение | Причина | Состояние |</p><p>|---|---|---|---|---|</p><p>| ADR-001 | 2026-10-04 | Взять вариант 4 ЛР2 - B2B-лендинг конструкторов «Модуль» | Совмещает витрину, каталог, форму и документацию в одном статическом MVP | Принято для локальной работы |</p><p>| ADR-002 | 2026-10-04 | Для ЛР1 выбрать форму «Получить коммерческое предложение» | Сценарий формы совпадает с B2B-контактом из лендинга | Принято; публикация pending |</p><p>| ADR-003 | 2026-10-04 | Сделать MVP статическим, а заявки и редактор хранить в localStorage | Не требуются сервер, реальные персональные данные или внешние токены | Принято для учебной демонстрации |</p><p>| ADR-004 | 2026-10-04 | Использовать Kanban и WIP 2 на общей доске; при одном исполнителе личный лимит 1 | Непрерывный поток проще вести без подтвержденного состава команды | Принято как учебный план |</p><p>| ADR-005 | 2026-10-04 | Принять GitHub Flow для будущего удаленного репозитория | Простая модель main + feature-ветки соответствует небольшому статическому MVP | Запланировано; remote pending |</p><p>| ADR-006 | 2026-10-04 | Предложить GitHub Actions для CI и условный CD в <code>main</code> | Соответствует примеру из материала CICD.pdf | Конфигурация/репозиторий pending |</p><p>| ADR-007 | 2026-10-04 | Не указывать внешние ссылки до их фактического создания | Не подменять учебный план утверждением о выполненной интеграции | Принято |</p>", "wiki/Glossary.md": "<h1>Glossary - глоссарий</h1><p>| Термин | Значение в проекте |</p><p>|---|---|</p><p>| B2B | Продажи организациям и корпоративным заказчикам. |</p><p>| MVP | Минимальный набор функций, достаточный для демонстрации основного сценария. |</p><p>| Набор | Каталожная позиция конструктора с ценой, числом деталей и минимальной партией. |</p><p>| Категория | Направление набора: образование, корпоративные подарки или розница. |</p><p>| Партия | Количество одинаковых наборов в расчете заявки. |</p><p>| Квалифицированная заявка | Запрос с именем, компанией, email, набором и количеством; в MVP это только локальная запись. |</p><p>| User Story | Формулировка потребности пользователя по шаблону «Как..., я хочу..., чтобы...». |</p><p>| AC | Acceptance Criteria - проверяемое условие приемки. |</p><p>| WIP | Work In Progress - ограничение числа одновременно выполняемых задач. |</p><p>| Kanban | Метод управления непрерывным потоком задач по колонкам доски. |</p><p>| localStorage | Локальное хранилище браузера; в MVP не является серверной базой. |</p><p>| Feature-ветка | Изолированная Git-ветка для одной задачи. |</p><p>| CI/CD | Автоматические проверки, сборка и последующая доставка приложения. |</p><p>| DoD | Definition of Done - критерии готовности результата. |</p>", "wiki/Home.md": "<h1>Home - проект «Модуль»</h1><h2>Назначение</h2><p>«Модуль» - учебный B2B-лендинг с каталогом модульных конструкторов. Посетитель выбирает направление и набор, просматривает ориентировочную цену партии и сохраняет демонстрационную заявку в браузере.</p><h2>Границы локального MVP</h2><ul><li>одностраничная адаптивная витрина с якорной навигацией;</li><li>разделы «О продукте», «Каталог», «О компании», «FAQ», «Контакты»;</li><li>каталог с категориями, поиском, ценовым фильтром и сортировкой;</li><li>открытый демонстрационный редактор каталога;</li><li>расчет партии и скидки;</li><li>форма заявки с валидацией и хранением только в `localStorage`;</li><li>учебный кабинет с просмотром, экспортом и очисткой локальных заявок.</li></ul><h2>Артефакты</h2><ul><li>исходный локальный прототип: `../../project/app/index.html`;</li><li>[MVP Scope](MVP-Scope.md);</li><li>[User Flow](../design/user-flow.drawio);</li><li>[Wireframes](../design/wireframes.html);</li><li>[Backlog](../lab2/backlog.csv);</li><li>[Kanban-доска](../board.html).</li></ul><h2>Состояние интеграций</h2><p>Яндекс 360/Трекер, Яндекс Формы, CRM, GitHub/GitLab и публичный хостинг не подключены. Для них подготовлены документы и конфигурационные заготовки; удаленные URL имеют статус <code>pending</code>.</p>", "wiki/MVP-Scope.md": "<h1>MVP Scope - границы и приемка</h1><h2>Цель</h2><p>Показать заказчику понятный путь от выбора B2B-набора до сохраненной демонстрационной заявки, не подключая реальную оплату, доставку, CRM или сервер.</p><h2>Входит в MVP</h2><ul><li>адаптивный лендинг и якорная навигация;</li><li>три направления каталога, поиск, фильтры и сортировка;</li><li>карточка набора и ориентировочный расчет партии;</li><li>форма заявки с валидацией обязательных полей;</li><li>локальное сохранение заявки, просмотр, экспорт JSON и очистка;</li><li>открытый учебный редактор каталога;</li><li>FAQ, контакты и предупреждение о демонстрационном режиме;</li><li>документы: User Flow, wireframes, backlog, CI/CD-план.</li></ul><h2>Отложено</h2><p>Реальная CRM/почта, серверная БД, авторизация, платежи, доставка, аккаунты менеджеров, защищенная админка, аналитика стороннего сервиса, видео-хостинг, внешняя публикация и домен.</p><h2>User Stories и критерии приемки</h2><h3>US-01 - просмотреть предложение</h3><p><strong>Как</strong> корпоративный заказчик, <strong>я хочу</strong> понять пользу наборов и увидеть основные направления, <strong>чтобы</strong> решить, подходит ли продукт.</p><ul><li>AC1: Дано открыта главная страница. Когда пользователь переходит по якорям. Тогда открываются разделы о продукте, каталог, FAQ и контакты.</li><li>AC2: Дано ширина окна меняется. Когда ширина становится мобильной. Тогда текст, навигация и карточки остаются читаемыми.</li><li>AC3: Дано пользователь не включил JavaScript. Когда страница загружена. Тогда основной текст и предупреждение остаются доступными.</li></ul><p>Связь: <code>MOD-101</code>, <code>MOD-102</code>, <code>MOD-103</code>.</p><h3>US-02 - найти набор</h3><p><strong>Как</strong> заказчик, <strong>я хочу</strong> фильтровать и сортировать каталог, <strong>чтобы</strong> быстро найти подходящий вариант.</p><ul><li>AC1: Дано в каталоге есть позиции. Когда выбрана категория. Тогда отображаются только позиции выбранного направления.</li><li>AC2: Дано введен текст поиска. Когда совпадений нет. Тогда показывается понятное сообщение и доступна очистка фильтра.</li><li>AC3: Дано выбран предел цены или сортировка. Когда список обновлен. Тогда карточки соответствуют выбранным условиям.</li></ul><p>Связь: <code>MOD-201</code>, <code>MOD-202</code>.</p><h3>US-03 - изменить демонстрационный каталог</h3><p><strong>Как</strong> учебный менеджер, <strong>я хочу</strong> добавить или изменить набор, <strong>чтобы</strong> показать сценарий редактирования каталога.</p><ul><li>AC1: Дано открыт учебный кабинет. Когда заполнены обязательные поля нового набора. Тогда позиция появляется в каталоге и сохраняется локально.</li><li>AC2: Дано позиция существует. Когда нажата кнопка редактирования. Тогда форма заполняется ее данными.</li><li>AC3: Дано пользователь восстанавливает исходный каталог. Когда подтверждает действие. Тогда демонстрационные изменения удаляются только в этом браузере.</li></ul><p>Связь: <code>MOD-203</code>.</p><h3>US-04 - рассчитать заявку</h3><p><strong>Как</strong> корпоративный заказчик, <strong>я хочу</strong> указать набор и количество, <strong>чтобы</strong> увидеть ориентировочную сумму партии и скидку.</p><ul><li>AC1: Дано выбран набор с минимальной партией. Когда введено количество меньше минимума. Тогда показывается ошибка и заявка не сохраняется.</li><li>AC2: Дано количество допустимо. Когда значение меняется. Тогда сумма и скидка пересчитываются.</li><li>AC3: Дано количество нечисловое или превышает максимум. Когда выполняется проверка. Тогда поле отмечается ошибкой.</li></ul><p>Связь: <code>MOD-302</code>.</p><h3>US-05 - сохранить учебную заявку</h3><p><strong>Как</strong> заказчик, <strong>я хочу</strong> заполнить имя, компанию, email и набор, <strong>чтобы</strong> сохранить запрос для демонстрации.</p><ul><li>AC1: Дано обязательные поля пусты. Когда нажата кнопка сохранения. Тогда отображаются ошибки у соответствующих полей.</li><li>AC2: Дано поля заполнены корректно и отмечено согласие. Когда заявка сохранена. Тогда она появляется в кабинете и остается после обновления страницы.</li><li>AC3: Дано форма успешно сохранена. Когда отображается статус. Тогда явно указано, что данные находятся только в этом браузере.</li></ul><p>Связь: <code>MOD-301</code>, <code>MOD-302</code>.</p><h3>US-06 - контролировать локальные данные</h3><p><strong>Как</strong> учебный менеджер, <strong>я хочу</strong> просмотреть, экспортировать и удалить заявки, <strong>чтобы</strong> контролировать демонстрационные данные.</p><ul><li>AC1: Дано заявки есть в localStorage. Когда открыт кабинет. Тогда отображаются количество и список заявок.</li><li>AC2: Дано есть заявки. Когда нажата кнопка экспорта. Тогда скачивается JSON без обращения к сети.</li><li>AC3: Дано есть заявки. Когда пользователь удаляет запись или очищает данные. Тогда список обновляется, а удаленная запись не отображается.</li></ul><p>Связь: <code>MOD-303</code>.</p><h2>Definition of Done</h2><p>История считается готовой, если: есть проверяемый результат в локальном приложении; выполнены все AC; нет ошибок валидации в штатном сценарии; состояние описано в backlog; внешний шаг, если нужен, отмечен <code>pending</code>; реальные персональные данные не используются.</p>", "wiki/Onboarding.md": "<h1>Onboarding - локальный запуск</h1><h2>Что нужно</h2><ul><li>Windows или macOS/Linux;</li><li>Node.js версии, совместимой с `package.json`;</li><li>браузер с включенным JavaScript;</li><li>папка проекта `Готовые лабораторные/project`.</li></ul><p>Пароли, токены, приглашения и доступы к внешним сервисам в этом документе не хранятся и не выдавались.</p><h2>Локальный сценарий</h2><p>1. Открыть папку <code>Готовые лабораторные/project</code>.</p><p>2. Установить зависимости командой <code>npm install</code> (если они появятся в проекте).</p><p>3. Запустить проверки: <code>npm run lint</code> и <code>npm test</code>.</p><p>4. Собрать проект: <code>npm run build</code>.</p><p>5. Открыть локальный файл/сервер согласно инструкции проекта и проверить якоря, каталог, фильтры и заявку.</p><p>6. Для очистки демонстрационных данных открыть раздел «Учебный кабинет» и удалить заявки или очистить данные браузера.</p><h2>Правила данных</h2><ul><li>Использовать только вымышленные данные.</li><li>Заявка из локального MVP не отправляется в CRM и не покидает браузер.</li><li>`hello@modul.example` - демонстрационный адрес домена `.example`, не канал связи.</li><li>Внешние сервисы подключаются только после отдельной настройки и проверки доступа.</li></ul><h2>Ссылки и доступы</h2><p>Постоянные URL Wiki, Трекера, репозитория, Яндекс Формы и хостинга: <strong>не заданы (pending)</strong>.</p>", "wiki/Team.md": "<h1>Team - команда</h1><h2>Известный участник</h2><p>| Участник | Роль в локальной учебной подготовке | Контакт | Статус |</p><p>|---|---|---|---|</p><p>| А.А. Первых, группа 3Втба-1 | Team Lead, аналитик, frontend, QA и документация (совмещенные роли для локального выполнения) | Не указан | Участвует в подготовке локального комплекта |</p><p>Другие участники и их контакты в исходных материалах не указаны, поэтому в командную таблицу не добавляются. При создании организации их нужно будет внести после получения реальных адресов и подтверждения приглашений.</p><h2>Распределение ответственности</h2><ul><li>**Team Lead:** структура работ, решения и контроль границ MVP.</li><li>**Аналитик:** User Stories, критерии приемки, глоссарий и backlog.</li><li>**Frontend:** статическая витрина, каталог, фильтры и формы.</li><li>**QA:** локальные проверки, сценарии ошибок, контроль приемки.</li><li>**Документация:** Wiki, user flow, wireframes, CI/CD-план.</li></ul><p>Это учебное распределение обязанностей, а не подтверждение фактического состава внешней команды.</p>"};const artifacts=[["board.html", "Kanban-доска (offline)"], ["board.json", "Kanban state JSON"], ["traceability.csv", "Трассировка требований"], ["source-choices.md", "Выбор вариантов"], ["lab1/prompts.md", "Промпты Алисы"], ["lab1/form-spec.json", "Спецификация формы"], ["lab1/form-structure.md", "Структура формы"], ["lab1/publication-instructions.md", "План публикации формы"], ["lab2/backlog.csv", "Backlog: 4 epic + 12 tasks"], ["lab2/external-steps.csv", "Внешние шаги (pending)"], ["lab3/MVP-Scope.md", "ЛР3 MVP Scope"], ["lab4/sprint-plan.md", "ЛР4 Kanban план"], ["lab5/Git-Workflow.md", "ЛР5 Git workflow"], ["lab6/CI-CD-Plan.md", "ЛР6 CI/CD план"], ["design/user-flow.drawio", "User Flow draw.io"], ["design/wireframes.svg", "Wireframes SVG"], ["design/wireframes.html", "Wireframes HTML"], ["../project/app/index.html", "Локальное приложение"], ["../evidence/browser-checks.json", "Browser smoke evidence"], ["../project/evidence/test.log", "Unit-test evidence"]];const nav=document.querySelector('#md-nav'),content=document.querySelector('#content');function choose(rel,btn){document.querySelectorAll('#md-nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');content.innerHTML=pages[rel];}Object.keys(pages).forEach((rel,i)=>{const b=document.createElement('button');b.textContent=rel;b.addEventListener('click',()=>choose(rel,b));nav.append(b);if(i===0){b.click()}});const a=document.querySelector('#artifact-nav');artifacts.forEach(([href,label])=>{const x=document.createElement('a');x.href=href;x.textContent=label;x.target='_blank';a.append(x)});</script></body></html>
