<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Модуль — материалы лабораторных работ</title><style>.content{min-width:0;overflow-wrap:anywhere}:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#1e2b3d;background:#f3f6fb;--ink:#13233f;--blue:#2550c7;--line:#d8e1ee}*{box-sizing:border-box}body{margin:0}header{background:var(--ink);color:#fff;padding:28px 32px}header h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:#cfdbef}main{max-width:1450px;margin:auto;padding:24px 32px;display:grid;grid-template-columns:310px 1fr;gap:24px}.panel,.content{background:#fff;border:1px solid var(--line);border-radius:14px}.panel{padding:16px;align-self:start;position:sticky;top:18px}.panel h2{font-size:16px;margin:0 0 12px}.panel button{display:block;width:100%;border:0;text-align:left;background:#f2f5fb;color:#263b5b;margin:5px 0;padding:9px;border-radius:8px;cursor:pointer}.panel button.active{background:#2550c7;color:#fff}.links{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.links a{display:block;color:var(--blue);font-size:13px;padding:4px 0;text-decoration:none}.content{padding:28px;min-height:700px}.content h1{font-size:26px;color:var(--ink);margin-top:0}.content h2{font-size:21px;color:var(--ink);margin-top:28px}.content h3{font-size:17px;color:var(--ink);margin-top:23px}.content p,.content li{line-height:1.55}.content code{background:#eef2f8;padding:2px 5px;border-radius:4px}.content pre{background:#172640;color:#e7edf7;padding:14px;border-radius:8px;overflow:auto}.content pre code{background:transparent;padding:0;color:inherit}.content a{color:var(--blue)}.status{font-size:13px;color:#5b6c82;margin-top:14px}@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}.panel{position:static}}.table-wrap{overflow:auto;margin:18px 0}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}th,td{border:1px solid #d8e1ee;padding:10px 12px;text-align:left;vertical-align:top}th{background:#eef3fb;font-weight:700}blockquote{border-left:4px solid #7292d5;background:#f5f8fd;padding:12px 16px;margin:16px 0;color:#354d70}</style></head><body><header><h1>«Модуль» — материалы лабораторных работ</h1><p>Лабораторные 1–6 · реальные сервисы, документация, проверки и исходники</p></header><main><aside class="panel"><h2>Документация проекта</h2><div id="md-nav"></div><div class="links"><h2>Сервисы и подтверждения</h2><div id="artifact-nav"></div></div><p class="status">Документы встроены в страницу. Ссылки на сервисы открываются отдельно; фактические состояния записаны в реестре результатов.</p></aside><article class="content" id="content"></article></main><script>
const pages={"wiki/Home.md":"\u003ch1>Home — проект «Модуль»\u003c/h1>\n\u003cp>«Модуль» — B2B-лендинг с каталогом модульных конструкторов. Пользователь выбирает направление и набор, рассчитывает ориентировочную стоимость партии и сохраняет заявку в браузере. Для внешнего запроса опубликована Яндекс Форма.\u003c/p>\n\u003ch2>Приложение и сервисы\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://akov40320.github.io/modul-labs/\">Работающее приложение\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs\">Репозиторий\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/pull/1\">PR №1\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37269189301\">Успешные CI и deploy\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003cp>GitHub Projects используется вместо Яндекс Трекера. \u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a> опубликована. \u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a> создан: 16 issues. \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a> содержит четыре проверенных низкодетализированных экрана; кликабельный прототип проверен; настройка доски проверена: 14 Done / 2 In Progress. Пробная отправка Яндекс Формы проверена: ошибки обязательных полей, email и количества; корректный запрос с пустым телефоном отправлен успешно. \u003ca href=\"https://alice.yandex.ru/chat/01a10a9a-23e4-4000-ab5b-a5dc1bb7b0b2/\">Алиса AI\u003c/a>: два запроса и ответа получены.\u003c/p>\n\u003ch2>Границы MVP\u003c/h2>\n\u003cul>\n\u003cli>адаптивная витрина с якорной навигацией, каталогом, FAQ и контактами;\u003c/li>\n\u003cli>категории, поиск, ценовой фильтр и сортировка;\u003c/li>\n\u003cli>редактор демонстрационного каталога;\u003c/li>\n\u003cli>расчет партии и скидки;\u003c/li>\n\u003cli>валидация заявки и хранение в localStorage;\u003c/li>\n\u003cli>кабинет: просмотр, экспорт и очистка данных;\u003c/li>\n\u003cli>опубликованное приложение и автоматический CI/CD.\u003c/li>\n\u003c/ul>\n\u003cp>Данные формы приложения сохраняются в браузере. Яндекс Форма работает как отдельный сервис; CRM, серверная база, платежи и защищенная админка отложены.\u003c/p>\n\u003ch2>Документация\u003c/h2>\n\u003cp>\u003ca href=\"wiki/Team.md\">Team\u003c/a> · \u003ca href=\"wiki/Glossary.md\">Glossary\u003c/a> · \u003ca href=\"wiki/Onboarding.md\">Onboarding\u003c/a> · \u003ca href=\"wiki/Decision-Log.md\">Decision Log\u003c/a> · \u003ca href=\"wiki/MVP-Scope.md\">MVP Scope\u003c/a> · \u003ca href=\"wiki/CI-CD-Pipeline.md\">CI/CD\u003c/a>.\u003c/p>\n\u003cp>\u003ca href=\"design/user-flow.drawio\">User Flow\u003c/a> · \u003ca href=\"design/wireframes.html\">Макеты\u003c/a> · \u003ca href=\"lab2/backlog.csv\">Backlog\u003c/a> · \u003ca href=\"board.html\">Снимок задач\u003c/a> · \u003ca href=\"service-mapping.md\">Соответствие сервисов\u003c/a>.\u003c/p>\n\u003cp>\u003ca href=\"design/figma-prototype.md\">Проверенный прототип Figma и переходы\u003c/a>.\u003c/p>\n\u003ch2>Подтвержденное состояние на 05.10.2026\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a>: \u003cstrong>14 Done / 2 In Progress\u003c/strong>; активны MOD-EPIC-04 и MOD-403. WIP: In Progress 2, Review 1. Поля Priority, Role, Start date, Target date и Design link заполнены во всех 16 карточках.\u003c/p>\n\u003cp>\u003ca href=\"https://www.figma.com/proto/QJOUjnQiwxzXIUY2ATDpZm/%D0%9C%D0%BE%D0%B4%D1%83%D0%BB%D1%8C-%E2%80%94-MVP-%D0%BC%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%B8-%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D1%81%D0%BA%D0%B8%D0%B9-%D0%BF%D1%83%D1%82%D1%8C?node-id=1-105&t=QIxddXrGjI39AaY0-0&scaling=min-zoom&content-scaling=fixed&page-id=1%3A104&starting-point-node-id=1%3A105\">Figma-прототип\u003c/a>: каталог → форма → подтверждение → каталог; три перехода проверены. \u003ca href=\"https://github.com/akov40320/modul-labs/pull/18\">PR18\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/19\">PR19\u003c/a> и \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> объединены после успешного CI; конфликт PR20 разрешен. \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">Последующий CI и deploy\u003c/a> — SUCCESS, commit \u003ccode>978ac9bbe0ad52505ea03835505d67e0e404e722\u003c/code>.\u003c/p>\n","conflict-demo.md":"\u003ch1>Разрешение конфликта в GitHub\u003c/h1>\n\u003cp>\u003cstrong>Дата:\u003c/strong> 05.10.2026. \u003ca href=\"https://github.com/akov40320/modul-labs/pull/18\">PR18\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/19\">PR19\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> завершены merge после успешного обязательного CI. Реальный автор GitHub — \u003ccode>akov40320\u003c/code>.\u003c/p>\n\u003ch2>Выполненный сценарий\u003c/h2>\n\u003col>\n\u003cli>PR18 задает общий текст политики проверки заявки. Общая база после merge — commit \u003ccode>359c01e…\u003c/code>.\u003c/li>\n\u003cli>Из этой базы подготовлены ветки изменения email и количества. PR19 объединен первым.\u003c/li>\n\u003cli>PR20 до разрешения имел \u003cstrong>CONFLICTING / DIRTY\u003c/strong>, REST mergeable — \u003cstrong>false\u003c/strong>.\u003c/li>\n\u003cli>В конфликтной ветке согласован итоговый текст, удалены маркеры и выполнены проверки. Commit разрешения — \u003ccode>ee85890c946ddb4c6a859d67d30b7d4950b7e29c\u003c/code>, два родителя.\u003c/li>\n\u003cli>После успешного required CI PR20 объединен. Итоговый commit main — \u003ccode>978ac9bbe0ad52505ea03835505d67e0e404e722\u003c/code>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">CI и deploy после merge\u003c/a> успешны.\u003c/li>\n\u003c/ol>\n\u003ch2>Подтверждения\u003c/h2>\n\u003cp>Снимок конфликтного PR: \u003ccode>evidence/online/git-conflict.jpg\u003c/code>. Журнал: \u003ccode>evidence/online/git-conflict-log.txt\u003c/code>. Машиночитаемое состояние: \u003ccode>evidence/online/git-conflict-state.json\u003c/code>. Локальный ранний журнал \u003ccode>evidence/git-conflict.txt\u003c/code> сохранен как дополнительный материал, а внешний сценарий подтвержден отдельными PR.\u003c/p>\n\u003cp>Имена функциональных ответственных хранятся в задачах; GitHub-авторство определяется реальной историей сервиса.\u003c/p>\n","design/figma-prototype.md":"\u003ch1>Figma — макеты и проверенный прототип\u003c/h1>\n\u003cp>\u003cstrong>Дата проверки:\u003c/strong> 05.10.2026. \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Редактируемый файл\u003c/a> · \u003ca href=\"https://www.figma.com/proto/QJOUjnQiwxzXIUY2ATDpZm/%D0%9C%D0%BE%D0%B4%D1%83%D0%BB%D1%8C-%E2%80%94-MVP-%D0%BC%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%B8-%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D1%81%D0%BA%D0%B8%D0%B9-%D0%BF%D1%83%D1%82%D1%8C?node-id=1-105&t=QIxddXrGjI39AaY0-0&scaling=min-zoom&content-scaling=fixed&page-id=1%3A104&starting-point-node-id=1%3A105\">Кликабельный прототип\u003c/a>. Доступ к просмотру — по ссылке.\u003c/p>\n\u003cp>Четыре низкодетализированных макета перенесены и проверены. В отдельной странице «Прототип» созданы три frame: «01 Главная и каталог», «02 Форма коммерческого предложения», «03 Заявка принята». Страница «User Flow» содержит шесть узлов маршрута.\u003c/p>\n\u003ch2>Проверенные переходы\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Действие\u003c/th>\n\u003cth>Результат\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Нажатие CTA в каталоге\u003c/td>\n\u003ctd>Открывается форма КП\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Нажатие Submit формы\u003c/td>\n\u003ctd>Открывается экран успешной заявки\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Нажатие возврата\u003c/td>\n\u003ctd>Открывается каталог\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Все три перехода выполнены в Figma и проверены. Прототип демонстрирует навигацию; проверка ввода и реальная отправка выполняются отдельно в приложении и Яндекс Форме.\u003c/p>\n","lab1/alice-session.md":"\u003ch1>Сеанс Алисы AI для ЛР1\u003c/h1>\n\u003cp>\u003cstrong>Дата:\u003c/strong> 05.10.2026. \u003ca href=\"https://alice.yandex.ru/chat/01a10a9a-23e4-4000-ab5b-a5dc1bb7b0b2/\">Реальный чат\u003c/a>. Выполнены два запроса; ответы сохранены в DOM-снимке сеанса.\u003c/p>\n\u003ch2>Первый промпт\u003c/h2>\n\u003cblockquote>\n\u003cp>Помоги составить Яндекс Форму «Получить коммерческое предложение» для учебного проекта «Модуль» — B2B-каталога модульных конструкторов. Аудитория: школы, образовательные центры и компании. Поля: имя, компания, email, необязательный телефон, набор, количество, комментарий, согласие на обработку данных. Дай короткий заголовок, описание, названия полей, подсказки, обязательность и текст кнопки. Не обещай реальные сроки, цены и поставку.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>Ответ Алисы:\u003c/strong> предложены восемь полей, короткие подсказки, обязательные имя/организация/email/набор/количество/согласие, необязательные телефон и комментарий. Предложена кнопка «Отправить заявку на КП». Первоначальные обобщенные варианты наборов затем уточнены по каталогу.\u003c/p>\n\u003ch2>Второй промпт\u003c/h2>\n\u003cblockquote>\n\u003cp>Уточнение: в каталоге шесть наборов: Классный старт и Юный инженер — минимально 10; Город команды и Идея бренда — 25; Маленький мир и Большой создатель — 20. Email обязателен, телефон необязателен, согласие обязательно, количество целое, максимум 10000. Дай понятные сообщения об ошибках и критерии приёмки Дано / Когда / Тогда. Отдели общую проверку количества 10–10000 от проверки минимума конкретного набора. Также дай короткий текст подтверждения отправки без обещаний сроков.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>Ответ Алисы:\u003c/strong> перечислены шесть наборов и минимумы, ошибки обязательности и формата, отдельная проверка минимальной партии, шестнадцать сценариев «Дано / Когда / Тогда», включая пустой телефон, количество ниже минимума и корректную отправку.\u003c/p>\n\u003ch2>Адаптация к реализованной форме\u003c/h2>\n\u003cul>\n\u003cli>Предложения Алисы использованы как материал проектирования; фактические настройки проверены в \u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форме\u003c/a>.\u003c/li>\n\u003cli>В ответе Алисы заголовок диапазона 10–10000 расходится с предложенным внутри текста общим минимумом 1. В форме сохранен проверенный целочисленный диапазон \u003cstrong>10–10000\u003c/strong>.\u003c/li>\n\u003cli>Предложенные Алисой верхние длины имени 100, организации 200 и комментария 2000 заменены фактическими \u003cstrong>80 / 120 / 1000\u003c/strong>, с нижними длинами имени и организации \u003cstrong>2\u003c/strong>.\u003c/li>\n\u003cli>Во внешней форме минимумы 10 / 25 / 20 указаны в вариантах наборов. Автоматическая зависимость количества от выбора не настроена; приложение проверяет минимум выбранного набора отдельно.\u003c/li>\n\u003cli>Ответ Алисы предлагает последующее письмо с КП. Наличие такого обещания в генерации не подтверждает настроенную рассылку: автоматическое отправление КП не заявляется.\u003c/li>\n\u003c/ul>\n\u003cp>Проверены ошибки обязательных полей, email и количества 9. Тестовый запрос с количеством 10 и пустым телефоном принят: ответ \u003cstrong>2544345845\u003c/strong>, \u003cstrong>05.10.2026 08:48:30 МСК\u003c/strong>.\u003c/p>\n","lab1/form-structure.md":"\u003ch1>Структура формы «Получить коммерческое предложение»\u003c/h1>\n\u003cp>\u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма\u003c/a> опубликована и проверена \u003cstrong>05.10.2026\u003c/strong>. Аудитория: школы, образовательные центры и компании.\u003c/p>\n\u003ch2>Восемь вопросов\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Ваше имя\u003c/strong> — обязательно, 2–80 символов.\u003c/li>\n\u003cli>\u003cstrong>Организация или компания\u003c/strong> — обязательно, 2–120 символов.\u003c/li>\n\u003cli>\u003cstrong>Email для коммерческого предложения\u003c/strong> — обязательно, email validator.\u003c/li>\n\u003cli>\u003cstrong>Телефон — необязательно\u003c/strong> — phone validator при заполнении.\u003c/li>\n\u003cli>\u003cstrong>Какой набор вас интересует?\u003c/strong> — обязательно, шесть вариантов каталога.\u003c/li>\n\u003cli>\u003cstrong>Количество наборов\u003c/strong> — обязательно, целое число 10–10000.\u003c/li>\n\u003cli>\u003cstrong>Комментарий к запросу — необязательно\u003c/strong> — до 1000 символов.\u003c/li>\n\u003cli>\u003cstrong>Согласен на обработку введённых данных для подготовки коммерческого предложения\u003c/strong> — обязательный checkbox.\u003c/li>\n\u003c/ol>\n\u003cp>Схема: \u003ca href=\"lab1/form-spec.json\">form-spec.json\u003c/a>. Минимумы наборов 10 / 25 / 20 указаны в выборе; внешняя форма применяет общий минимум количества 10. Автоматическая зависимость от выбранного набора реализована в приложении, а не в Яндекс Формах.\u003c/p>\n\u003ch2>Проверка\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Сценарий\u003c/th>\n\u003cth>Результат\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Пропущены обязательные поля\u003c/td>\n\u003ctd>Ошибки обязательности\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Неверный email\u003c/td>\n\u003ctd>«Введите корректный адрес электронной почты.»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Количество 9\u003c/td>\n\u003ctd>«Убедитесь, что значение больше либо равно 10.»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Корректный email, количество 10, телефон пуст\u003c/td>\n\u003ctd>Успешная отправка\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Подтвержден успешный экран после отправки; точный текст подтверждения не переписан в документацию. Приложение дополнительно рассчитывает партию и сохраняет заявку в браузере. Хранение приложения и ответы Яндекс Форм — отдельные результаты.\u003c/p>\n\u003ch2>Подтвержденный ответ формы\u003c/h2>\n\u003cp>Ответ \u003cstrong>2544345845\u003c/strong>, отправлен \u003cstrong>05.10.2026 08:48:30 МСК\u003c/strong>. Тестовые данные: имя «Проверка формы», организация «Учебный центр Модуль», email \u003ccode>demo@example.com\u003c/code>, набор «Классный старт», количество \u003cstrong>10\u003c/strong>, согласие \u003cstrong>Да\u003c/strong>, телефон пуст.\u003c/p>\n","lab1/prompts.md":"\u003ch1>ЛР1 — промпты для Алисы AI\u003c/h1>\n\u003cp>Выбранный вариант из PDF: \u003cstrong>(Ф) «Получить коммерческое предложение»\u003c/strong>. Промпты ниже подготовлены для проектирования B2B-формы «Модуль». \u003ca href=\"https://alice.yandex.ru/chat/01a10a9a-23e4-4000-ab5b-a5dc1bb7b0b2/\">Реальный сеанс Алисы AI\u003c/a> завершен: два запроса и ответа. Точные выполненные промпты и адаптация описаны в \u003ca href=\"lab1/alice-session.md\">alice-session.md\u003c/a>. Ниже сохранены дополнительные заготовки; их выполнение не заявляется. Яндекс Форма уже \u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">опубликована\u003c/a>.\u003c/p>\n\u003ch2>1. Аудитория и задача\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Ты продуктовый аналитик. Для учебного B2B-лендинга «Модуль» опиши 3 сегмента аудитории, которые могут запросить коммерческое предложение на модульные наборы конструкторов: образовательные организации, корпоративные заказчики и розничные партнеры. Для каждого сегмента укажи задачу, сомнение перед заявкой, обязательные поля формы и один проверяемый сигнал интереса. Не придумывай реальные компании, контакты или статистику. Ответ дай таблицей.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ожидаемый результат:\u003c/strong> таблица аудитории для проверки полей формы.\u003c/p>\n\u003ch2>2. Структура одностраничного приложения\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Ты UX-архитектор. Составь структуру статического B2B-лендинга «Модуль» для сценария «получить коммерческое предложение». Нужны якорные разделы: hero, о продукте, каталог, о компании, FAQ, контакты и форма заявки. Для каждого раздела укажи цель, один главный призыв к действию и связь со следующим шагом. Не добавляй оплату, доставку, личный кабинет или реальные интеграции.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ожидаемый результат:\u003c/strong> список блоков и переходов для wireframes.\u003c/p>\n\u003ch2>3. Тексты и тональность\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Ты редактор B2B-лендинга. Напиши черновики на русском языке для «Модуль»: заголовок hero, подзаголовок, три преимущества, короткий текст о компании, три FAQ и текст кнопки формы «Получить коммерческое предложение». Тон спокойный и конкретный, без неподтвержденных цифр, обещаний поставки и упоминания официальной связи с LEGO. В каждом тексте помечай демонстрационные характеристики как учебные.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ожидаемый результат:\u003c/strong> тексты, которые можно проверить вручную перед добавлением в HTML.\u003c/p>\n\u003ch2>4. Поля формы\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Ты специалист по UX-формам. Спроектируй форму «Получить коммерческое предложение» для B2B-каталога модульных конструкторов. Предложи обязательность и понятную подпись для полей: имя, компания, рабочий email, телефон (необязательно), интересующий набор, количество, комментарий и согласие. Добавь понятные сообщения ошибок, целое положительное количество и минимальные партии 10 / 25 / 20 по наборам. Не утверждай, что проверки уже настроены в Яндекс Формах.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ожидаемый результат:\u003c/strong> черновик схемы полей, совпадающий с \u003ccode>form-spec.json\u003c/code>.\u003c/p>\n\u003ch2>5. Проверка готового сценария\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Ты QA-редактор. Проверь описание учебной формы «Получить коммерческое предложение» и список критериев приемки. Составь позитивные, граничные и ошибочные сценарии: пустые обязательные поля, неверный email, количество меньше минимальной партии, допустимая партия, повторное открытие страницы, экспорт и очистка localStorage. Для каждого сценария укажи Дано, Когда, Тогда. Не утверждай, что тесты реально выполнены.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Ожидаемый результат:\u003c/strong> чек-лист для ручной проверки, а не отчет о фактическом запуске.\u003c/p>\n","lab1/publication-instructions.md":"\u003ch1>Публикация и проверка Яндекс Формы\u003c/h1>\n\u003cp>\u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Форма «Получить коммерческое предложение — Модуль»\u003c/a> опубликована \u003cstrong>05.10.2026\u003c/strong>. В форме восемь вопросов; выполнена пробная отправка.\u003c/p>\n\u003ch2>Подтвержденные настройки\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Вопрос\u003c/th>\n\u003cth>Обязательность и проверка\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Ваше имя\u003c/td>\n\u003ctd>Обязательно; 2–80 символов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Организация или компания\u003c/td>\n\u003ctd>Обязательно; 2–120 символов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Email для коммерческого предложения\u003c/td>\n\u003ctd>Обязательно; проверка email\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Телефон — необязательно\u003c/td>\n\u003ctd>Необязательно; проверка телефона при заполнении\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Какой набор вас интересует?\u003c/td>\n\u003ctd>Обязательно; шесть вариантов из каталога с минимальными партиями\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Количество наборов\u003c/td>\n\u003ctd>Обязательно; целое число 10–10000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Комментарий к запросу — необязательно\u003c/td>\n\u003ctd>Необязательно; до 1000 символов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Согласен на обработку введённых данных для подготовки коммерческого предложения\u003c/td>\n\u003ctd>Обязательный checkbox\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Результаты проверки\u003c/h2>\n\u003cul>\n\u003cli>Пустые обязательные поля: сообщения ошибок.\u003c/li>\n\u003cli>Неверный email: \u003cstrong>«Введите корректный адрес электронной почты.»\u003c/strong>\u003c/li>\n\u003cli>Количество 9: \u003cstrong>«Убедитесь, что значение больше либо равно 10.»\u003c/strong>\u003c/li>\n\u003cli>Корректный email \u003ccode>demo@example.com\u003c/code>, количество 10, пустой телефон: \u003cstrong>успешная отправка\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch2>Минимальные партии\u003c/h2>\n\u003cp>«Классный старт» и «Юный инженер» — 10; «Город команды» и «Идея бренда» — 25; «Маленький мир» и «Большой создатель» — 20. В Яндекс Форме эти значения указаны в выборе набора, но автоматическая валидация количества имеет общий минимум \u003cstrong>10\u003c/strong>. Условное ограничение по выбранному набору во внешней форме не настроено. Приложение самостоятельно проверяет минимум выбранного продукта.\u003c/p>\n\u003cp>Форма приложения хранит данные в localStorage. Ответы Яндекс Форм учитываются отдельно. Публикация и пробная отправка не означают подключения CRM или уведомлений получателю. \u003ca href=\"https://alice.yandex.ru/chat/01a10a9a-23e4-4000-ab5b-a5dc1bb7b0b2/\">Реальный сеанс Алисы AI\u003c/a> выполнен; два запроса и адаптация — \u003ca href=\"lab1/alice-session.md\">alice-session.md\u003c/a>.\u003c/p>\n\u003ch2>Подтвержденный ответ формы\u003c/h2>\n\u003cp>Ответ \u003cstrong>2544345845\u003c/strong>, отправлен \u003cstrong>05.10.2026 08:48:30 МСК\u003c/strong>. Тестовые данные: имя «Проверка формы», организация «Учебный центр Модуль», email \u003ccode>demo@example.com\u003c/code>, набор «Классный старт», количество \u003cstrong>10\u003c/strong>, согласие \u003cstrong>Да\u003c/strong>, телефон пуст.\u003c/p>\n","lab2/tracker-setup-plan.md":"\u003ch1>ЛР2 — настройка рабочего пространства GitHub Projects\u003c/h1>\n\u003cp>Фактическая платформа управления задачами: \u003cstrong>GitHub Projects + GitHub Issues\u003c/strong>. GitHub-аккаунт: \u003cstrong>akov40320\u003c/strong>. \u003ca href=\"https://github.com/akov40320/modul-labs\">Репозиторий\u003c/a> и \u003ca href=\"https://akov40320.github.io/modul-labs/\">приложение\u003c/a> опубликованы. \u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a> опубликована. \u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a> создан с 16 issues; \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a> содержит проверенные макеты. Конфигурация Project проверена: 16 карточек, 14 Done / 2 In Progress, WIP 2 / 1.\u003c/p>\n\u003cp>В исходном задании указаны организация Яндекс 360 и Яндекс Трекер. В используемой схеме задачи и доска переносятся в GitHub Projects; соответствие сервисов отражено в \u003ca href=\"service-mapping.md\">service-mapping.md\u003c/a>.\u003c/p>\n\u003ch2>Последовательность настройки\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Выполнено:\u003c/strong> создан публичный \u003ca href=\"https://github.com/akov40320/modul-labs\">репозиторий проекта «Модуль»\u003c/a> в аккаунте \u003ccode>akov40320\u003c/code>. Публичный репозиторий позволяет использовать защиту ветки и GitHub Pages на бесплатном тарифе.\u003c/li>\n\u003cli>\u003cstrong>Выполнено:\u003c/strong> \u003ca href=\"https://github.com/users/akov40320/projects/1\">GitHub Project\u003c/a> создан по шаблону Kanban и содержит 16 issues. Пять статусов, поля и итоговые значения проверены: 14 Done / 2 In Progress.\u003c/li>\n\u003cli>\u003cstrong>Выполнено:\u003c/strong> настроены пять значений \u003cstrong>Status\u003c/strong>: \u003cstrong>Backlog\u003c/strong>, \u003cstrong>To Do\u003c/strong>, \u003cstrong>In Progress\u003c/strong>, \u003cstrong>Review\u003c/strong>, \u003cstrong>Done\u003c/strong>. Status используется для колонок Board.\u003c/li>\n\u003cli>\u003cstrong>Выполнено:\u003c/strong> у всех 16 карточек заполнены \u003cstrong>Priority\u003c/strong>, текстовое поле \u003cstrong>Role\u003c/strong>, \u003cstrong>Start date\u003c/strong>, \u003cstrong>Target date\u003c/strong>, \u003cstrong>Design link\u003c/strong>. Тип отражают labels, версию — milestone. Size и Estimate не заполнены: оценка трудозатрат не задавалась. Роли соответствуют \u003ca href=\"wiki/Team.md\">Team\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>Выполнено:\u003c/strong> перенесены четыре эпика и двенадцать задач из \u003ca href=\"lab2/backlog.csv\">backlog.csv\u003c/a> в GitHub Issues. Сохранить исходные идентификаторы \u003ccode>MOD-…\u003c/code> в названиях или описаниях, поскольку номера GitHub Issues назначаются сервисом.\u003c/li>\n\u003cli>\u003cstrong>Выполнено:\u003c/strong> созданы 12 native parent/sub-issue связей и 34 labels. В описания issues перенесены User Story, критерии приемки, зависимости, материалы и окружение; назначены milestone и поля Project.\u003c/li>\n\u003cli>Назначать issues подтвержденному аккаунту \u003ccode>akov40320\u003c/code>; функциональную ответственность отражать полем \u003cstrong>«Роль»\u003c/strong>. Других assignees добавлять только после появления доступных аккаунтов.\u003c/li>\n\u003cli>\u003cstrong>Выполнено:\u003c/strong> Wiki и макеты опубликованы, Design link содержит URL Figma во всех 16 карточках; кликабельный прототип проверен.\u003c/li>\n\u003cli>\u003cstrong>Выполнено:\u003c/strong> создан \u003ca href=\"https://github.com/akov40320/modul-labs/milestone/1\">milestone «MVP 1.0»\u003c/a>. Плановая контрольная дата MVP — \u003cstrong>10.10.2026\u003c/strong>; его объем описан в MVP Scope.\u003c/li>\n\u003cli>\u003cstrong>Выполнено:\u003c/strong> лимиты \u003cstrong>In Progress — 2\u003c/strong>, \u003cstrong>Review — 1\u003c/strong>, Backlog без ограничения. GitHub показывает превышение лимита; правило соблюдается при выборе следующей задачи.\u003c/li>\n\u003cli>\u003cstrong>Проверено:\u003c/strong> завершенные задачи находятся в Done. У эпиков 2–4 все дочерние задачи закрыты; сами эпики также закрыты. Выполнение подтверждается результатом и проверкой.\u003c/li>\n\u003c/ol>\n\u003ch2>Проверка готовности\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Результат\u003c/th>\n\u003cth>Подтверждение\u003c/th>\n\u003cth>Статус\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Репозиторий опубликован\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/akov40320/modul-labs\">GitHub\u003c/a>\u003c/td>\n\u003ctd>выполнено\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Project создан по шаблону Kanban\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a>\u003c/td>\n\u003ctd>настроен и проверен\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Четыре epic и двенадцать задач\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/akov40320/modul-labs/issues\">Issues\u003c/a>, 12 native sub-issues\u003c/td>\n\u003ctd>выполнено\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Поля и роли заполнены\u003c/td>\n\u003ctd>Повторное чтение 96 значений шести полей 16 карточек\u003c/td>\n\u003ctd>выполнено\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Wiki, макеты и milestone опубликованы\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a>, \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/milestone/1\">milestone\u003c/a>\u003c/td>\n\u003ctd>опубликованы; ссылки Project заполнены и проверены\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WIP 2 / 1 настроен\u003c/td>\n\u003ctd>Проверенные лимиты In Progress / Review\u003c/td>\n\u003ctd>выполнено\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Итоговое состояние — \u003cstrong>14 Done / 2 In Progress\u003c/strong>. Активны MOD-EPIC-04 и MOD-403. Высокий приоритет соответствует P1, средний — P2; P0 зарезервирован для критического блокера. У всех карточек Start date = 2026-10-05 и Target date = 2026-10-10. Значения Role: \u003ccode>Team Lead / frontend\u003c/code>, \u003ccode>аналитик / дизайн / QA\u003c/code>, \u003ccode>backend / DevOps\u003c/code>. \u003ca href=\"lab2/backlog.csv\">Backlog\u003c/a> и \u003ca href=\"board.json\">снимок доски\u003c/a> содержат соответствие исходных ключей и фактических данных сервиса.\u003c/p>\n","lab3/MVP-Scope.md":"\u003ch1>ЛР3 - MVP Scope и трассировка\u003c/h1>\n\u003cp>Основная страница: \u003ca href=\"wiki/MVP-Scope.md\">Wiki/MVP Scope\u003c/a>.\u003c/p>\n\u003ch2>Трассировка\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>User Story\u003c/th>\n\u003cth>Макет/User Flow\u003c/th>\n\u003cth>Задачи\u003c/th>\n\u003cth>Результат\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>US-01\u003c/td>\n\u003ctd>\u003ccode>../design/wireframes.html\u003c/code>, \u003ccode>../design/user-flow.drawio\u003c/code>\u003c/td>\n\u003ctd>MOD-101..103\u003c/td>\n\u003ctd>\u003ca href=\"https://akov40320.github.io/modul-labs/\">Опубликованная витрина\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US-02\u003c/td>\n\u003ctd>Wireframe каталога\u003c/td>\n\u003ctd>MOD-201..202\u003c/td>\n\u003ctd>Фильтры и сортировка каталога\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US-03\u003c/td>\n\u003ctd>Wireframe кабинета\u003c/td>\n\u003ctd>MOD-203\u003c/td>\n\u003ctd>Учебный редактор\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US-04\u003c/td>\n\u003ctd>Wireframe заявки\u003c/td>\n\u003ctd>MOD-302\u003c/td>\n\u003ctd>Расчет партии\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US-05\u003c/td>\n\u003ctd>User Flow: форма -&gt; сохранение\u003c/td>\n\u003ctd>MOD-301..302\u003c/td>\n\u003ctd>Локальная валидация и сохранение\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>US-06\u003c/td>\n\u003ctd>Wireframe кабинета\u003c/td>\n\u003ctd>MOD-303\u003c/td>\n\u003ctd>Просмотр/export/очистка\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Контрольная точка MVP\u003c/h2>\n\u003cp>Веха «MVP заявки и каталога»: плановая дата 10.10.2026. \u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a> опубликована. \u003ca href=\"https://github.com/akov40320/modul-labs/milestone/1\">Milestone «MVP 1.0»\u003c/a> создан. \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a> содержит четыре проверенных низкодетализированных экрана; кликабельный прототип проверен. \u003ca href=\"https://akov40320.github.io/modul-labs/\">Приложение\u003c/a> и \u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма\u003c/a> опубликованы; отправка внешней формы и сообщения ошибок проверены.\u003c/p>\n\u003cp>\u003ca href=\"design/figma-prototype.md\">Проверенный прототип Figma и переходы\u003c/a>.\u003c/p>\n","lab4/sprint-plan.md":"\u003ch1>ЛР4 — Kanban и план работ по MVP\u003c/h1>\n\u003ch2>Методологии\u003c/h2>\n\u003cp>\u003cstrong>Scrum\u003c/strong> организует разработку спринтами фиксированной длины. Команда задает цель спринта, выбирает задачи, проводит планирование, ежедневное обсуждение, review и retrospective. Состав работ и даты помогают оценить результат итерации.\u003c/p>\n\u003cp>\u003cstrong>Kanban\u003c/strong> организует непрерывный поток задач. Карточки проходят последовательные состояния, а ограничения WIP помогают завершать начатое. Новая задача берется в работу после освобождения места в активной колонке.\u003c/p>\n\u003ch2>Выбор и рабочая доска\u003c/h2>\n\u003cp>Для проекта «Модуль» выбран \u003cstrong>Kanban\u003c/strong>. Требования, макеты, разработка интерфейса и проверка проходят общую последовательность, поэтому состояние каждой задачи удобно видеть на одной доске. Приоритеты можно уточнять по мере готовности зависимостей, не ожидая начала следующего спринта.\u003c/p>\n\u003cp>Платформа: \u003cstrong>GitHub Projects\u003c/strong>, связанная с GitHub Issues и репозиторием проекта. \u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a> создан по шаблону Kanban и содержит 16 issues. Конфигурация полей и статусов проверена: 14 Done / 2 In Progress. Исходное задание указывает Яндекс Трекер; фактическая замена зафиксирована в \u003ca href=\"service-mapping.md\">service-mapping.md\u003c/a>.\u003c/p>\n\u003ch2>Колонки и ограничения\u003c/h2>\n\u003cp>\u003cstrong>Backlog → To Do → In Progress → Review → Done.\u003c/strong> Русские названия ниже поясняют смысл статусов; фактические значения сервиса указаны на английском.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Колонка\u003c/th>\n\u003cth>Содержание\u003c/th>\n\u003cth>WIP\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Бэклог\u003c/td>\n\u003ctd>Все известные задачи и улучшения\u003c/td>\n\u003ctd>Не задан\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>К выполнению\u003c/td>\n\u003ctd>Выбранные приоритетные задачи, готовые к началу\u003c/td>\n\u003ctd>Не задан\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>В работе\u003c/td>\n\u003ctd>Активная реализация\u003c/td>\n\u003ctd>\u003cstrong>2\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>На проверке\u003c/td>\n\u003ctd>Проверка результата по критериям приемки\u003c/td>\n\u003ctd>\u003cstrong>1\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Готово\u003c/td>\n\u003ctd>Проверенные результаты; CI успешен для изменений приложения\u003c/td>\n\u003ctd>Не задан\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>GitHub column limits отображают количество карточек и подсвечивают превышение, но не блокируют перенос технически. При заполненной колонке новая задача не берется: сначала завершается текущая или устраняется затор на проверке. Возврат в \u003cstrong>«В работе»\u003c/strong> сопровождается комментарием с проблемой и ожидаемым исправлением.\u003c/p>\n\u003ch2>Планирование периода 5–10 октября 2026\u003c/h2>\n\u003cp>\u003cstrong>Цель:\u003c/strong> подготовить и показать MVP, в котором заказчик выбирает набор, рассчитывает партию, сохраняет заявку и проверяет результат в кабинете.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Дата\u003c/th>\n\u003cth>Плановое действие\u003c/th>\n\u003cth>Ответственная роль\u003c/th>\n\u003cth>Результат для проверки\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>05.10.2026\u003c/td>\n\u003ctd>Настроить Project, перенести backlog, уточнить приоритеты и границы MVP\u003c/td>\n\u003ctd>Team Lead / аналитик\u003c/td>\n\u003ctd>Доска, issues, MVP Scope\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06.10.2026\u003c/td>\n\u003ctd>Проверить витрину, каталог, фильтры и карточки\u003c/td>\n\u003ctd>Frontend / дизайн\u003c/td>\n\u003ctd>Сценарий выбора набора\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>07.10.2026\u003c/td>\n\u003ctd>Проверить заявку, расчет партии и ошибки ввода\u003c/td>\n\u003ctd>Frontend / backend / QA\u003c/td>\n\u003ctd>Критерии приемки заявки\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>08.10.2026\u003c/td>\n\u003ctd>Проверить кабинет, экспорт, очистку и редактор\u003c/td>\n\u003ctd>Backend / frontend / QA\u003c/td>\n\u003ctd>Управление сохраненными данными\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>09.10.2026\u003c/td>\n\u003ctd>Сверить документацию CI/CD и состояние опубликованной версии\u003c/td>\n\u003ctd>DevOps / Team Lead\u003c/td>\n\u003ctd>Ссылки на проверенные CI и публичный URL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10.10.2026\u003c/td>\n\u003ctd>Проверить MVP, связанные макеты и документацию\u003c/td>\n\u003ctd>QA / Team Lead\u003c/td>\n\u003ctd>Milestone и демонстрация продукта\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Таблица задает плановые действия. Репозиторий, PR №1, защита main и CI/CD уже выполнены 05.10.2026; \u003ca href=\"https://akov40320.github.io/modul-labs/\">приложение опубликовано\u003c/a>. Остальные фактические даты и результаты фиксируются в issues по мере выполнения.\u003c/p>\n\u003ch2>Контрольная точка MVP\u003c/h2>\n\u003cp>\u003cstrong>Название в GitHub:\u003c/strong> \u003ca href=\"https://github.com/akov40320/modul-labs/milestone/1\">MVP 1.0\u003c/a>. \u003cstrong>Плановая дата:\u003c/strong> 10.10.2026. \u003cstrong>Объем демонстрации:\u003c/strong> фильтрация набора → расчет партии → сохранение заявки → просмотр и экспорт. Milestone создан и содержит задачи проекта.\u003c/p>\n\u003ch2>Ежедневная работа и история\u003c/h2>\n\u003col>\n\u003cli>Выбрать приоритетную задачу из \u003cstrong>«К выполнению»\u003c/strong>, проверить зависимости и свободное место по WIP.\u003c/li>\n\u003cli>Перевести карточку в \u003cstrong>«В работе»\u003c/strong>, создать feature-ветку и указать связь с issue.\u003c/li>\n\u003cli>После реализации добавить ссылку на PR, результаты проверки и передать карточку в \u003cstrong>«На проверке»\u003c/strong>.\u003c/li>\n\u003cli>Проверить критерии приемки. Замечания записать в issue; при успехе завершить PR и перевести карточку в \u003cstrong>«Готово»\u003c/strong>.\u003c/li>\n\u003cli>Продолжать ведение доски \u003cstrong>в течение всего семестра\u003c/strong>, как требует исходное задание. История сервисных действий служит подтверждением движения задач.\u003c/li>\n\u003c/ol>\n\u003cp>Файлы \u003ca href=\"board.json\">board.json\u003c/a> и \u003ca href=\"board.html\">board.html\u003c/a> сохраняют снимок 16 реальных карточек GitHub Projects: 14 Done / 2 In Progress. Конфигурация полей, колонок и лимитов проверена. Семестровая история пополняется по фактическому движению задач.\u003c/p>\n\u003ch2>Подтвержденное состояние на 05.10.2026\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a>: \u003cstrong>14 Done / 2 In Progress\u003c/strong>; активны MOD-EPIC-04 и MOD-403. WIP: In Progress 2, Review 1. Поля Priority, Role, Start date, Target date и Design link заполнены во всех 16 карточках.\u003c/p>\n\u003cp>\u003ca href=\"https://www.figma.com/proto/QJOUjnQiwxzXIUY2ATDpZm/%D0%9C%D0%BE%D0%B4%D1%83%D0%BB%D1%8C-%E2%80%94-MVP-%D0%BC%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%B8-%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D1%81%D0%BA%D0%B8%D0%B9-%D0%BF%D1%83%D1%82%D1%8C?node-id=1-105&t=QIxddXrGjI39AaY0-0&scaling=min-zoom&content-scaling=fixed&page-id=1%3A104&starting-point-node-id=1%3A105\">Figma-прототип\u003c/a>: каталог → форма → подтверждение → каталог; три перехода проверены. \u003ca href=\"https://github.com/akov40320/modul-labs/pull/18\">PR18\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/19\">PR19\u003c/a> и \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> объединены после успешного CI; конфликт PR20 разрешен. \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">Последующий CI и deploy\u003c/a> — SUCCESS, commit \u003ccode>978ac9bbe0ad52505ea03835505d67e0e404e722\u003c/code>.\u003c/p>\n","lab5/Git-Workflow.md":"\u003ch1>ЛР5 — GitHub Flow и правила коммитов\u003c/h1>\n\u003cp>\u003ca href=\"https://github.com/akov40320/modul-labs\">Репозиторий\u003c/a> использует GitHub Flow: защищенная \u003ccode>main\u003c/code>, короткие feature-ветки и Pull Request. \u003ca href=\"https://github.com/akov40320/modul-labs/pull/1\">PR №1\u003c/a> проверяет поведение неуспешного и исправленного CI.\u003c/p>\n\u003ch2>Имена веток и коммиты\u003c/h2>\n\u003cp>Ветки связываются с задачами: \u003ccode>feature/MOD-201-catalog-filters\u003c/code>, \u003ccode>feature/MOD-301-request-form\u003c/code>, \u003ccode>bugfix/MOD-302-quote-validation\u003c/code>.\u003c/p>\n\u003cp>Conventional Commits: \u003ccode>feat:\u003c/code>, \u003ccode>fix:\u003c/code>, \u003ccode>docs:\u003c/code>, \u003ccode>style:\u003c/code>, \u003ccode>refactor:\u003c/code>, \u003ccode>test:\u003c/code>, \u003ccode>chore:\u003c/code>. Сообщение описывает смысл изменения, например \u003ccode>fix: validate minimum batch size\u003c/code>.\u003c/p>\n\u003ch2>Процесс изменения\u003c/h2>\n\u003col>\n\u003cli>Создать ветку от актуальной main и указать связанную задачу.\u003c/li>\n\u003cli>Сделать небольшие коммиты и запустить lint/test/build.\u003c/li>\n\u003cli>Открыть PR, проверить критерии приемки и дождаться CI.\u003c/li>\n\u003cli>Синхронизировать ветку с main, если она отстала.\u003c/li>\n\u003cli>После успешных проверок и разрешения обсуждений объединить PR.\u003c/li>\n\u003c/ol>\n\u003ch2>Защита main\u003c/h2>\n\u003cp>Обязательный status check — \u003cstrong>ci\u003c/strong>. Ветка должна быть актуальной перед merge (\u003cstrong>strict\u003c/strong>); правила применяются к администратору. Требуется разрешение обсуждений. Force push и удаление запрещены. Обязательное число approving reviews — \u003cstrong>0\u003c/strong>.\u003c/p>\n\u003cp>При таком количестве reviews наличие независимого одобрения не утверждается: его можно фиксировать дополнительно по действительным комментариям.\u003c/p>\n\u003ch2>Проверенные результаты\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37268219608\">Неуспешный CI PR №1\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37268345975\">Исправленный успешный CI\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37269189301\">Успешный CI и deploy после merge\u003c/a>.\u003c/li>\n\u003cli>Commit: \u003ccode>061b6814a47e1bbbf0bc483b12d0ec23e4bcbeab\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003ca href=\"conflict-demo.md\">Разрешение конфликтов\u003c/a> описывается отдельно. Реальный конфликт \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> разрешен; \u003ca href=\"https://github.com/akov40320/modul-labs/pull/18\">PR18\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/19\">PR19\u003c/a> и PR20 объединены после CI. Фактическое GitHub-авторство — akov40320. \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">CI и deploy после merge\u003c/a> успешны.\u003c/p>\n","lab6/CI-CD-Plan.md":"\u003ch1>ЛР6 — выполненный CI/CD\u003c/h1>\n\u003cp>\u003ca href=\"https://github.com/akov40320/modul-labs\">Репозиторий\u003c/a> содержит \u003ca href=\"../.github/workflows/ci-cd.yml\">workflow CI/CD\u003c/a>. Реальные GitHub Actions запускают проверки при push/PR и автоматически публикуют main в GitHub Pages после успешного CI.\u003c/p>\n\u003ch2>Проверенные сервисные результаты\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Этап\u003c/th>\n\u003cth>Результат\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>PR №1 с ошибкой\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37268219608\">Неуспешный CI, run 37268219608\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Исправление PR №1\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37268345975\">Успешный CI, run 37268345975\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Merge и автоматическая доставка\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37269189301\">CI и deploy SUCCESS, run 37269189301\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Опубликованное приложение\u003c/td>\n\u003ctd>\u003ca href=\"https://akov40320.github.io/modul-labs/\">GitHub Pages\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"https://github.com/akov40320/modul-labs/pull/1\">PR №1\u003c/a>. Commit успешного deploy: \u003ccode>061b6814a47e1bbbf0bc483b12d0ec23e4bcbeab\u003c/code>.\u003c/p>\n\u003ch2>Проверки и защита\u003c/h2>\n\u003cp>Локальные проверки: lint — 102 проверки; test — 16 unit-тестов; build — 9 файлов; browser smoke — 10 сценариев. Журналы: \u003ccode>project/evidence/*.log\u003c/code>, \u003ccode>evidence/browser-checks.json\u003c/code>. Онлайн-журналы и изображения: \u003ccode>evidence/online\u003c/code>.\u003c/p>\n\u003cp>main защищена: обязательный \u003cstrong>ci\u003c/strong>, strict, применение к администратору, разрешение обсуждений; force push и удаление запрещены; обязательных approving reviews — 0.\u003c/p>\n\u003ch2>Документация\u003c/h2>\n\u003cp>\u003ca href=\"wiki/CI-CD-Pipeline.md\">Wiki CI/CD Pipeline\u003c/a> описывает триггеры, команды, deploy и просмотр логов. \u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a> опубликована; CI/CD и Pages выполнены.\u003c/p>\n\u003ch2>Публикация после разрешения конфликта\u003c/h2>\n\u003cp>PR18/19/20 объединены после успешного CI. Итоговый commit: \u003ccode>978ac9bbe0ad52505ea03835505d67e0e404e722\u003c/code>. \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">Последующий CI и deploy\u003c/a> успешны.\u003c/p>\n","merge-policy.md":"\u003ch1>Порядок проверки заявки\u003c/h1>\n\u003cp>Приоритет проверки заявки: email и количество проверяются до сохранения; ошибки обоих полей показываются вместе.\u003c/p>\n\u003cp>При отправке заявки проверяются корректность email и допустимое количество товара.\nЕсли проверка не пройдена, интерфейс показывает ошибки и не сохраняет заявку.\nДокумент фиксирует согласованное правило для разработки и тестирования формы.\u003c/p>\n","README.md":"\u003ch1>Документация проекта «Модуль»\u003c/h1>\n\u003cp>\u003ca href=\"index.html\">Открыть страницу материалов\u003c/a>\u003c/p>\n\u003cp>Приложение опубликовано в \u003ca href=\"https://akov40320.github.io/modul-labs/\">GitHub Pages\u003c/a>, исходники — в \u003ca href=\"https://github.com/akov40320/modul-labs\">GitHub\u003c/a>. \u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма\u003c/a> опубликована с восемью вопросами; пробная отправка и сообщения ошибок проверены. CI/CD выполнен в реальном репозитории. \u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a> опубликована; \u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a> создан с 16 issues; \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a> содержит проверенные макеты; \u003ca href=\"https://alice.yandex.ru/chat/01a10a9a-23e4-4000-ab5b-a5dc1bb7b0b2/\">Алиса AI\u003c/a> — два реальных запроса. Кликабельный прототип проверен; поля доски заполнены и проверены: 14 Done / 2 In Progress.\u003c/p>\n\u003ch2>Навигация\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"service-mapping.md\">Соответствие сервисов исходным заданиям\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"online-results.json\">Реестр онлайн-результатов\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"source-choices.md\">Выбор вариантов\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"wiki/Home.md\">Wiki Home\u003c/a>, \u003ca href=\"wiki/Team.md\">Team\u003c/a>, \u003ca href=\"wiki/Glossary.md\">Glossary\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"wiki/Onboarding.md\">Onboarding\u003c/a>, \u003ca href=\"wiki/Decision-Log.md\">Decision Log\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"wiki/MVP-Scope.md\">MVP Scope\u003c/a>, \u003ca href=\"wiki/CI-CD-Pipeline.md\">CI/CD Pipeline\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"lab1/alice-session.md\">ЛР1: реальный сеанс Алисы\u003c/a>, \u003ca href=\"lab1/prompts.md\">промпты\u003c/a>, \u003ca href=\"lab1/form-spec.json\">спецификация\u003c/a>, \u003ca href=\"lab1/form-structure.md\">структура\u003c/a>, \u003ca href=\"lab1/publication-instructions.md\">публикация\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"lab2/backlog.csv\">ЛР2: backlog\u003c/a>, \u003ca href=\"lab2/tracker-setup-plan.md\">настройка Projects\u003c/a>, \u003ca href=\"lab2/external-steps.csv\">реестр внешних действий\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"lab3/MVP-Scope.md\">ЛР3: трассировка\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"board.html\">ЛР4: снимок задач\u003c/a>, \u003ca href=\"lab4/sprint-plan.md\">план Kanban\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"lab5/Git-Workflow.md\">ЛР5: GitHub Flow\u003c/a>, \u003ca href=\"conflict-demo.md\">конфликт\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"lab6/CI-CD-Plan.md\">ЛР6: результаты CI/CD\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"design/user-flow.drawio\">User Flow\u003c/a>, \u003ca href=\"design/wireframes.svg\">макеты SVG\u003c/a>, \u003ca href=\"design/wireframes.html\">просмотр макетов\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Состояния\u003c/h2>\n\u003cp>\u003cstrong>Выполнено\u003c/strong> означает, что указан проверяемый результат: файл, журнал, URL или сервисное действие. \u003cstrong>В работе\u003c/strong> означает начатый, но еще не завершенный этап. \u003cstrong>pending\u003c/strong> используется для результатов без подтвержденной ссылки или завершенной проверки. Состояние каждой интеграции фиксируется отдельно.\u003c/p>\n\u003cp>Студент: А.А. Первых, 3Втба-1. Преподаватели: Абарникова Елена Борисовна, Шаповалова Варвара Сергеевна.\u003c/p>\n","review-a.md":"\u003ch1>Проверка фильтра\u003c/h1>\n\u003cp>Проверить категорию, поиск без учета регистра и пустую выдачу.\u003c/p>\n\u003cp>Сброс должен восстанавливать все карточки исходного каталога.\u003c/p>\n","review-b.md":"\u003ch1>Проверка редактора\u003c/h1>\n\u003cp>Изменить название набора и проверить обновление каталога.\u003c/p>\n\u003cp>Перезагрузка страницы сохраняет изменение в текущем браузере.\u003c/p>\n","service-mapping.md":"\u003ch1>Соответствие сервисов лабораторных работ\u003c/h1>\n\u003cp>Проект «Модуль» опубликован в \u003ca href=\"https://github.com/akov40320/modul-labs\">GitHub\u003c/a> и \u003ca href=\"https://akov40320.github.io/modul-labs/\">GitHub Pages\u003c/a>. \u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма\u003c/a> опубликована и проверена. Состояния сервисов по данным на \u003cstrong>05.10.2026\u003c/strong> приведены ниже; машиночитаемый реестр — \u003ca href=\"online-results.json\">online-results.json\u003c/a>.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ЛР\u003c/th>\n\u003cth>Исходное требование\u003c/th>\n\u003cth>Фактический сервис и результат\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Алиса AI; Яндекс Формы для формы/опроса либо Директ для лендинга\u003c/td>\n\u003ctd>Яндекс Форма: восемь вопросов, ошибки обязательных полей/email/количества и успешная отправка проверены. \u003ca href=\"https://alice.yandex.ru/chat/01a10a9a-23e4-4000-ab5b-a5dc1bb7b0b2/\">Алиса AI\u003c/a>: два запроса и ответа получены. Выбран вариант формы, поэтому Директ не требуется.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>Организация Яндекс 360, Яндекс Трекер, доступы, очередь, эпики и подзадачи\u003c/td>\n\u003ctd>Платформа заменена на GitHub Projects / Issues. Backlog: четыре epic, двенадцать задач, роли и критерии приемки. 16 issues и 12 native sub-issue связей созданы; \u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a> создан, настройка проверена: 14 Done / 2 In Progress.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Wiki, User Flow, прототипы, MVP Scope, истории/DoD, веха и ссылки на макеты\u003c/td>\n\u003ctd>Исходники Wiki, User Flow и макетов подготовлены. \u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">GitHub Wiki\u003c/a> опубликована: семь страниц. \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a>: четыре макета перенесены и проверены; три кадра кликабельного прототипа и три перехода проверены. \u003ca href=\"https://github.com/akov40320/modul-labs/milestone/1\">Milestone «MVP 1.0»\u003c/a> создан.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Доска Яндекс Трекера; Scrum/Kanban, пять колонок, WIP и ежедневная работа весь семестр\u003c/td>\n\u003ctd>Используется GitHub Projects, Kanban. Пять колонок; WIP «В работе» 2 и «На проверке» 1. Снимок задач обновлен; \u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a> создан с 16 issues; конфигурация проверена: 14 Done / 2 In Progress. Семестровая история продолжается.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>GitHub/GitLab, модель ветвления, защита, коммиты и feature-ветки, конфликт\u003c/td>\n\u003ctd>Публичный GitHub, GitHub Flow, PR №1 и защита main выполнены. Реальный конфликт \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> разрешен; PR18/19/20 объединены, required CI и последующий deploy успешны. Авторство и доступы определяются по данным Git.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>Тесты/сборка, CI, защита ветки, красный/зеленый PR, CD и публичный URL\u003c/td>\n\u003ctd>GitHub Actions: красный и зеленый CI в PR №1; после merge CI/deploy SUCCESS. Приложение опубликовано в GitHub Pages.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Фактическая замена Трекера\u003c/h2>\n\u003cp>ЛР2 прямо указывает создание организации Яндекс 360 и активацию Яндекс Трекера; ЛР4 — доску в Яндекс Трекере. Эти этапы заменены рабочим пространством GitHub Projects / Issues. В документах указана фактически использованная платформа.\u003c/p>\n\u003cp>Распределение ролей отражено в \u003ca href=\"wiki/Team.md\">Team\u003c/a>. Assignee в GitHub — \u003ccode>akov40320\u003c/code>; поле \u003cstrong>«Роль»\u003c/strong> определяет ответственность. Приглашения, подтверждение доступа, авторство коммитов и review фиксируются по действительным действиям. Начальная доска не означает завершения требуемой ЛР4 работы в течение всего семестра.\u003c/p>\n\u003ch2>Проверенные ссылки\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs\">Репозиторий\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://akov40320.github.io/modul-labs/\">Приложение\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/pull/1\">PR №1\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37268219608\">Неуспешный CI\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37268345975\">Исправленный CI\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37269189301\">Успешные CI и deploy после merge\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003cp>Commit первой публикации: \u003ccode>061b6814a47e1bbbf0bc483b12d0ec23e4bcbeab\u003c/code>. main: обязательный ci, strict, применение к администратору, разрешение обсуждений, reviews 0, запрет force push и удаления.\u003c/p>\n\u003ch2>Проверка формы и ограничения\u003c/h2>\n\u003cp>При пустых обязательных полях отображаются ошибки. Неверный email: \u003cstrong>«Введите корректный адрес электронной почты.»\u003c/strong> Количество 9: \u003cstrong>«Убедитесь, что значение больше либо равно 10.»\u003c/strong> Корректный email, количество 10 и пустой телефон: успешная отправка.\u003c/p>\n\u003cp>В Яндекс Форме настроен общий диапазон целого количества \u003cstrong>10–10000\u003c/strong>. Минимумы \u003cstrong>10 / 25 / 20\u003c/strong> указаны для наборов, но автоматическая зависимость минимума от выбранного набора во внешней форме не настроена. Приложение проверяет минимальную партию выбранного набора отдельно. Хранение localStorage приложения не является подключением CRM.\u003c/p>\n\u003ch2>Сервисы в работе\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a> опубликована. \u003ca href=\"https://github.com/users/akov40320/projects/1\">GitHub Project\u003c/a> создан, \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a> содержит проверенные макеты, \u003ca href=\"https://github.com/akov40320/modul-labs/milestone/1\">milestone\u003c/a> создан, \u003ca href=\"https://alice.yandex.ru/chat/01a10a9a-23e4-4000-ab5b-a5dc1bb7b0b2/\">Алиса AI\u003c/a> завершена. Кликабельный прототип Figma проверен; поля Project заполнены и проверены: 14 Done / 2 In Progress. Реестр внешних действий: \u003ca href=\"lab2/external-steps.csv\">external-steps.csv\u003c/a>.\u003c/p>\n\u003ch2>Бесплатная конфигурация\u003c/h2>\n\u003cp>Публичный репозиторий обеспечивает доступ к бесплатной защите main и GitHub Pages. GitHub Projects включает поля и parent/sub-issues. Column limits подсвечивают превышение WIP, но технически не запрещают перенос карточки.\u003c/p>\n\u003cp>\u003ca href=\"https://github.com/pricing\">Тарифы GitHub\u003c/a> · \u003ca href=\"https://docs.github.com/en/issues/planning-and-tracking-with-projects/customizing-views-in-your-project/customizing-the-board-layout\">доски и WIP\u003c/a> · \u003ca href=\"https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/adding-sub-issues\">подзадачи\u003c/a> · \u003ca href=\"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches\">защита веток\u003c/a>.\u003c/p>\n\u003ch2>Подтвержденное состояние на 05.10.2026\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a>: \u003cstrong>14 Done / 2 In Progress\u003c/strong>; активны MOD-EPIC-04 и MOD-403. WIP: In Progress 2, Review 1. Поля Priority, Role, Start date, Target date и Design link заполнены во всех 16 карточках.\u003c/p>\n\u003cp>\u003ca href=\"https://www.figma.com/proto/QJOUjnQiwxzXIUY2ATDpZm/%D0%9C%D0%BE%D0%B4%D1%83%D0%BB%D1%8C-%E2%80%94-MVP-%D0%BC%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%B8-%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D1%81%D0%BA%D0%B8%D0%B9-%D0%BF%D1%83%D1%82%D1%8C?node-id=1-105&t=QIxddXrGjI39AaY0-0&scaling=min-zoom&content-scaling=fixed&page-id=1%3A104&starting-point-node-id=1%3A105\">Figma-прототип\u003c/a>: каталог → форма → подтверждение → каталог; три перехода проверены. \u003ca href=\"https://github.com/akov40320/modul-labs/pull/18\">PR18\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/19\">PR19\u003c/a> и \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> объединены после успешного CI; конфликт PR20 разрешен. \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">Последующий CI и deploy\u003c/a> — SUCCESS, commit \u003ccode>978ac9bbe0ad52505ea03835505d67e0e404e722\u003c/code>.\u003c/p>\n","source-choices.md":"\u003ch1>Выбор вариантов и исходные требования\u003c/h1>\n\u003ch2>ЛР1 - выбранный вариант\u003c/h2>\n\u003cp>Точная формулировка из файла \u003ccode>лр1/Задания для 3ВТба.pdf\u003c/code>:\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>(Ф) «Получить коммерческое предложение».\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма «Получить коммерческое предложение — Модуль»\u003c/a> опубликована 05.10.2026 с восемью вопросами. Проверены ошибки обязательных полей, email, количества и успешная отправка. \u003ca href=\"https://alice.yandex.ru/chat/01a10a9a-23e4-4000-ab5b-a5dc1bb7b0b2/\">Два запроса Алисы AI\u003c/a> выполнены; выводы и адаптация — \u003ca href=\"lab1/alice-session.md\">alice-session.md\u003c/a>.\u003c/p>\n\u003ch2>ЛР2 - выбранный вариант 4\u003c/h2>\n\u003cp>Точная формулировка из \u003ccode>лр2/569b2571c9daeea0e9ff85edb4b3f71a.docx\u003c/code>:\u003c/p>\n\u003cblockquote>\n\u003cp>разработать одностраничный лендинг для B2B-продаж конструкторов в стиле LEGO. Включает дизайн с нуля, якорное меню, блоки (о продукте, пакеты услуг, о компании, FAQ, контакты), каталог товаров с фильтрами и админкой для редактирования, встраивание видео, форму заявки с интеграцией в CRM/почту, адаптивную верстку, базовое SEO и аналитику\u003c/p>\n\u003c/blockquote>\n\u003cp>MVP опубликован в \u003ca href=\"https://akov40320.github.io/modul-labs/\">GitHub Pages\u003c/a>. Форма приложения сохраняет заявки в \u003ccode>localStorage\u003c/code>; Яндекс Форма опубликована отдельно. CRM/почта приложения пока не подключены. Реальные продажи, оплата, доставка и интеграция с LEGO отсутствуют.\u003c/p>\n\u003ch2>Обязательные поля задачи по методичке ЛР2\u003c/h2>\n\u003cp>Источник: \u003ccode>лр2/8a327fc4b2aeb86014e97577f69d0dac.docx\u003c/code>.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Детали задачи:\u003c/strong> тип, приоритет, метки, окружение, версия исправления.\u003c/li>\n\u003cli>\u003cstrong>Блокер/дефект:\u003c/strong> описание, предусловия, что случилось, шаги воспроизведения, фактический результат, ожидаемый результат, примечания.\u003c/li>\n\u003cli>\u003cstrong>Доработка:\u003c/strong> описание, User Story по форме «Как [роль], я хочу [действие], чтобы [ценность]».\u003c/li>\n\u003cli>\u003cstrong>Критерии приемки:\u003c/strong> проверяемые условия в формате «Дано + Когда + Тогда».\u003c/li>\n\u003cli>\u003cstrong>Дополнительные материалы:\u003c/strong> макеты/дизайн, API, аналоги, документация.\u003c/li>\n\u003cli>\u003cstrong>Нефункциональные требования:\u003c/strong> устройства (десктоп/мобильные/все) и изменения бэкенда/API.\u003c/li>\n\u003cli>\u003cstrong>Связи и подзадачи:\u003c/strong> связи с задачами; подзадачи для аналитики, бэкенда, фронтенда, тестирования, UX/UI, документации и DevOps с назначением исполнителя.\u003c/li>\n\u003c/ol>\n\u003cp>Файл \u003ccode>lab2/backlog.csv\u003c/code> повторяет эти поля для каждой записи. Состав и ответственность приведены в \u003ca href=\"wiki/Team.md\">Team\u003c/a>. Технический assignee GitHub — доступный аккаунт akov40320; роли задач отражаются отдельным полем.\u003c/p>\n","wiki/CI-CD-Pipeline.md":"\u003ch1>CI/CD Pipeline\u003c/h1>\n\u003cp>Пайплайн выполнен в \u003ca href=\"https://github.com/akov40320/modul-labs/actions\">GitHub Actions\u003c/a>. После успешного CI при push в main приложение автоматически опубликовано в \u003ca href=\"https://akov40320.github.io/modul-labs/\">GitHub Pages\u003c/a>.\u003c/p>\n\u003ch2>Схема\u003c/h2>\n\u003cp>\u003cstrong>push / PR → checkout → Node.js 22 → lint → unit-тесты → build → при push в main: Pages artifact → deploy.\u003c/strong>\u003c/p>\n\u003cp>Конфигурация: \u003ca href=\"../.github/workflows/ci-cd.yml\">ci-cd.yml\u003c/a>. Рабочая папка команд — \u003ccode>project\u003c/code>. Текущий проект не содержит внешних npm-зависимостей.\u003c/p>\n\u003ch2>Триггеры и шаги\u003c/h2>\n\u003cul>\n\u003cli>push во все ветки — CI;\u003c/li>\n\u003cli>pull_request — CI;\u003c/li>\n\u003cli>workflow_dispatch — ручной запуск;\u003c/li>\n\u003cli>push в main после успешного CI — публикация Pages.\u003c/li>\n\u003c/ul>\n\u003cp>CI выполняет \u003ccode>npm run lint\u003c/code>, \u003ccode>npm test\u003c/code>, \u003ccode>npm run build\u003c/code>. CD использует \u003ccode>actions/deploy-pages@v4\u003c/code>, зависит от CI и публикует artifact из \u003ccode>project/dist\u003c/code>. Права workflow: \u003ccode>pages: write\u003c/code>, \u003ccode>id-token: write\u003c/code>; environment — \u003ccode>github-pages\u003c/code>. Отдельный токен внешнего хостинга не требуется.\u003c/p>\n\u003ch2>Проверка\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/pull/1\">PR №1\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37268219608\">Красный CI\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37268345975\">Зеленый CI после исправления\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37269189301\">Успешные CI и deploy после merge\u003c/a>.\u003c/li>\n\u003cli>Commit первой публикации: \u003ccode>061b6814a47e1bbbf0bc483b12d0ec23e4bcbeab\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>Защита main требует успешный \u003cstrong>ci\u003c/strong> и актуальность ветки, применяется к администратору, требует разрешения обсуждений. Reviews — 0; force push и удаление запрещены.\u003c/p>\n\u003ch2>Логи и расширение\u003c/h2>\n\u003cp>Открыть вкладку \u003cstrong>Actions\u003c/strong>, выбрать запуск, затем job \u003cstrong>ci\u003c/strong> или \u003cstrong>deploy\u003c/strong> и раскрыть нужный шаг. Ссылка на конкретный запуск сохраняется в задаче.\u003c/p>\n\u003cp>Для нового шага изменить workflow в feature-ветке, добавить команду с ненулевым кодом при ошибке, открыть PR и проверить результат. Если меняется имя обязательного job, обновить branch protection после успешного запуска нового status check.\u003c/p>\n\u003cp>Локальные журналы и smoke-проверки находятся в \u003ccode>project/evidence\u003c/code> и \u003ccode>evidence/browser-checks.json\u003c/code>; сервисные подтверждения — в \u003ccode>evidence/online\u003c/code>. Публикация документации отслеживается в реестре сервисов.\u003c/p>\n\u003ch2>Публикация после разрешения конфликта\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/akov40320/modul-labs/pull/18\">PR18\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/19\">PR19\u003c/a> и \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> объединены после успешного CI. Конфликт PR20 в docs/merge-policy.md разрешен с сохранением норм email и количества. Итоговый commit: \u003ccode>978ac9bbe0ad52505ea03835505d67e0e404e722\u003c/code>. \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">Последующий CI и deploy\u003c/a> успешны.\u003c/p>\n","wiki/Decision-Log.md":"\u003ch1>Decision Log — журнал решений\u003c/h1>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Дата\u003c/th>\n\u003cth>Решение\u003c/th>\n\u003cth>Причина\u003c/th>\n\u003cth>Состояние\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>ADR-001\u003c/td>\n\u003ctd>04.10.2026\u003c/td>\n\u003ctd>Вариант 4 ЛР2: B2B-лендинг «Модуль»\u003c/td>\n\u003ctd>Объединяет витрину, каталог, форму и документацию\u003c/td>\n\u003ctd>Приложение опубликовано\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADR-002\u003c/td>\n\u003ctd>05.10.2026\u003c/td>\n\u003ctd>Форма «Получить коммерческое предложение» для ЛР1\u003c/td>\n\u003ctd>Соответствует B2B-запросу\u003c/td>\n\u003ctd>Яндекс Форма опубликована; ошибки и успешная отправка проверены\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADR-003\u003c/td>\n\u003ctd>04.10.2026\u003c/td>\n\u003ctd>Статический MVP с localStorage\u003c/td>\n\u003ctd>Воспроизводимые сценарии без серверной БД\u003c/td>\n\u003ctd>Реализовано; CRM и сервер отложены\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADR-004\u003c/td>\n\u003ctd>05.10.2026\u003c/td>\n\u003ctd>Kanban; WIP In Progress 2, Review 1\u003c/td>\n\u003ctd>Ограничивает активную реализацию и очередь проверки\u003c/td>\n\u003ctd>Лимиты настроены и проверены; 14 Done / 2 In Progress\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADR-005\u003c/td>\n\u003ctd>05.10.2026\u003c/td>\n\u003ctd>GitHub Flow: main + feature-ветки + PR\u003c/td>\n\u003ctd>Подходит для статического MVP\u003c/td>\n\u003ctd>Репозиторий и PR №1 опубликованы\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADR-006\u003c/td>\n\u003ctd>05.10.2026\u003c/td>\n\u003ctd>GitHub Actions и deploy Pages после успешного CI в main\u003c/td>\n\u003ctd>Автоматизирует проверки и публикацию\u003c/td>\n\u003ctd>Красный/зеленый CI проверены; merge и deploy успешны\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADR-007\u003c/td>\n\u003ctd>05.10.2026\u003c/td>\n\u003ctd>Записывать результаты с фактическими URL и журналами\u003c/td>\n\u003ctd>Обеспечивает проверяемость\u003c/td>\n\u003ctd>\u003ca href=\"online-results.json\">Реестр результатов\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADR-008\u003c/td>\n\u003ctd>05.10.2026\u003c/td>\n\u003ctd>GitHub Projects / Issues вместо Яндекс 360 / Трекера\u003c/td>\n\u003ctd>Бесплатная связка задач с кодом и CI/CD\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a> создан по шаблону Kanban: 16 issues; настройка проверена: 14 Done / 2 In Progress\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ADR-009\u003c/td>\n\u003ctd>05.10.2026\u003c/td>\n\u003ctd>Защитить main: обязательный ci, strict, enforce admins, разрешение обсуждений\u003c/td>\n\u003ctd>Не пропускать неуспешные или устаревшие проверки\u003c/td>\n\u003ctd>Настроено; reviews 0, force push и удаление запрещены\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"https://github.com/akov40320/modul-labs\">Репозиторий\u003c/a> · \u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма\u003c/a> · \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37269189301\">CI и deploy\u003c/a>.\u003c/p>\n\u003ch2>Подтвержденное состояние на 05.10.2026\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a>: \u003cstrong>14 Done / 2 In Progress\u003c/strong>; активны MOD-EPIC-04 и MOD-403. WIP: In Progress 2, Review 1. Поля Priority, Role, Start date, Target date и Design link заполнены во всех 16 карточках.\u003c/p>\n\u003cp>\u003ca href=\"https://www.figma.com/proto/QJOUjnQiwxzXIUY2ATDpZm/%D0%9C%D0%BE%D0%B4%D1%83%D0%BB%D1%8C-%E2%80%94-MVP-%D0%BC%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%B8-%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D1%81%D0%BA%D0%B8%D0%B9-%D0%BF%D1%83%D1%82%D1%8C?node-id=1-105&t=QIxddXrGjI39AaY0-0&scaling=min-zoom&content-scaling=fixed&page-id=1%3A104&starting-point-node-id=1%3A105\">Figma-прототип\u003c/a>: каталог → форма → подтверждение → каталог; три перехода проверены. \u003ca href=\"https://github.com/akov40320/modul-labs/pull/18\">PR18\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/19\">PR19\u003c/a> и \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> объединены после успешного CI; конфликт PR20 разрешен. \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">Последующий CI и deploy\u003c/a> — SUCCESS, commit \u003ccode>978ac9bbe0ad52505ea03835505d67e0e404e722\u003c/code>.\u003c/p>\n","wiki/Glossary.md":"\u003ch1>Glossary - глоссарий\u003c/h1>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Термин\u003c/th>\n\u003cth>Значение в проекте\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>B2B\u003c/td>\n\u003ctd>Продажи организациям и корпоративным заказчикам.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MVP\u003c/td>\n\u003ctd>Минимальный набор функций, достаточный для демонстрации основного сценария.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Набор\u003c/td>\n\u003ctd>Каталожная позиция конструктора с ценой, числом деталей и минимальной партией.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Категория\u003c/td>\n\u003ctd>Направление набора: образование, корпоративные подарки или розница.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Партия\u003c/td>\n\u003ctd>Количество одинаковых наборов в расчете заявки.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Квалифицированная заявка\u003c/td>\n\u003ctd>Запрос с именем, компанией, email, набором и количеством; в MVP это только локальная запись.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User Story\u003c/td>\n\u003ctd>Формулировка потребности пользователя по шаблону «Как..., я хочу..., чтобы...».\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AC\u003c/td>\n\u003ctd>Acceptance Criteria - проверяемое условие приемки.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WIP\u003c/td>\n\u003ctd>Work In Progress - ограничение числа одновременно выполняемых задач.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kanban\u003c/td>\n\u003ctd>Метод управления непрерывным потоком задач по колонкам доски.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>localStorage\u003c/td>\n\u003ctd>Локальное хранилище браузера; в MVP не является серверной базой.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Feature-ветка\u003c/td>\n\u003ctd>Изолированная Git-ветка для одной задачи.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CI/CD\u003c/td>\n\u003ctd>Автоматические проверки, сборка и последующая доставка приложения.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DoD\u003c/td>\n\u003ctd>Definition of Done - критерии готовности результата.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","wiki/MVP-Scope.md":"\u003ch1>MVP Scope - границы и приемка\u003c/h1>\n\u003ch2>Цель\u003c/h2>\n\u003cp>Показать заказчику понятный путь от выбора B2B-набора до сохраненной демонстрационной заявки, с опубликованным приложением и отдельной Яндекс Формой. CRM, платежи и серверная БД отложены.\u003c/p>\n\u003ch2>Входит в MVP\u003c/h2>\n\u003cul>\n\u003cli>адаптивный лендинг и якорная навигация;\u003c/li>\n\u003cli>три направления каталога, поиск, фильтры и сортировка;\u003c/li>\n\u003cli>карточка набора и ориентировочный расчет партии;\u003c/li>\n\u003cli>форма заявки с валидацией обязательных полей;\u003c/li>\n\u003cli>локальное сохранение заявки, просмотр, экспорт JSON и очистка;\u003c/li>\n\u003cli>открытый учебный редактор каталога;\u003c/li>\n\u003cli>FAQ, контакты и предупреждение о демонстрационном режиме;\u003c/li>\n\u003cli>документы: User Flow, wireframes, backlog, CI/CD-план.\u003c/li>\n\u003c/ul>\n\u003ch2>Отложено\u003c/h2>\n\u003cp>Реальная CRM/почта, серверная БД, авторизация, платежи, доставка, аккаунты менеджеров, защищенная админка, аналитика стороннего сервиса, видео-хостинг, собственный домен. Приложение уже опубликовано в GitHub Pages; Яндекс Форма опубликована отдельно.\u003c/p>\n\u003ch2>User Stories и критерии приемки\u003c/h2>\n\u003ch3>US-01 - просмотреть предложение\u003c/h3>\n\u003cp>\u003cstrong>Как\u003c/strong> корпоративный заказчик, \u003cstrong>я хочу\u003c/strong> понять пользу наборов и увидеть основные направления, \u003cstrong>чтобы\u003c/strong> решить, подходит ли продукт.\u003c/p>\n\u003cul>\n\u003cli>AC1: Дано открыта главная страница. Когда пользователь переходит по якорям. Тогда открываются разделы о продукте, каталог, FAQ и контакты.\u003c/li>\n\u003cli>AC2: Дано ширина окна меняется. Когда ширина становится мобильной. Тогда текст, навигация и карточки остаются читаемыми.\u003c/li>\n\u003cli>AC3: Дано пользователь не включил JavaScript. Когда страница загружена. Тогда основной текст и предупреждение остаются доступными.\u003c/li>\n\u003c/ul>\n\u003cp>Связь: \u003ccode>MOD-101\u003c/code>, \u003ccode>MOD-102\u003c/code>, \u003ccode>MOD-103\u003c/code>.\u003c/p>\n\u003ch3>US-02 - найти набор\u003c/h3>\n\u003cp>\u003cstrong>Как\u003c/strong> заказчик, \u003cstrong>я хочу\u003c/strong> фильтровать и сортировать каталог, \u003cstrong>чтобы\u003c/strong> быстро найти подходящий вариант.\u003c/p>\n\u003cul>\n\u003cli>AC1: Дано в каталоге есть позиции. Когда выбрана категория. Тогда отображаются только позиции выбранного направления.\u003c/li>\n\u003cli>AC2: Дано введен текст поиска. Когда совпадений нет. Тогда показывается понятное сообщение и доступна очистка фильтра.\u003c/li>\n\u003cli>AC3: Дано выбран предел цены или сортировка. Когда список обновлен. Тогда карточки соответствуют выбранным условиям.\u003c/li>\n\u003c/ul>\n\u003cp>Связь: \u003ccode>MOD-201\u003c/code>, \u003ccode>MOD-202\u003c/code>.\u003c/p>\n\u003ch3>US-03 - изменить демонстрационный каталог\u003c/h3>\n\u003cp>\u003cstrong>Как\u003c/strong> учебный менеджер, \u003cstrong>я хочу\u003c/strong> добавить или изменить набор, \u003cstrong>чтобы\u003c/strong> показать сценарий редактирования каталога.\u003c/p>\n\u003cul>\n\u003cli>AC1: Дано открыт учебный кабинет. Когда заполнены обязательные поля нового набора. Тогда позиция появляется в каталоге и сохраняется локально.\u003c/li>\n\u003cli>AC2: Дано позиция существует. Когда нажата кнопка редактирования. Тогда форма заполняется ее данными.\u003c/li>\n\u003cli>AC3: Дано пользователь восстанавливает исходный каталог. Когда подтверждает действие. Тогда демонстрационные изменения удаляются только в эт
