ом браузере.\u003c/li>\n\u003c/ul>\n\u003cp>Связь: \u003ccode>MOD-203\u003c/code>.\u003c/p>\n\u003ch3>US-04 - рассчитать заявку\u003c/h3>\n\u003cp>\u003cstrong>Как\u003c/strong> корпоративный заказчик, \u003cstrong>я хочу\u003c/strong> указать набор и количество, \u003cstrong>чтобы\u003c/strong> увидеть ориентировочную сумму партии и скидку.\u003c/p>\n\u003cul>\n\u003cli>AC1: Дано выбран набор с минимальной партией. Когда введено количество меньше минимума. Тогда показывается ошибка и заявка не сохраняется.\u003c/li>\n\u003cli>AC2: Дано количество допустимо. Когда значение меняется. Тогда сумма и скидка пересчитываются.\u003c/li>\n\u003cli>AC3: Дано количество нечисловое или превышает максимум. Когда выполняется проверка. Тогда поле отмечается ошибкой.\u003c/li>\n\u003c/ul>\n\u003cp>Связь: \u003ccode>MOD-302\u003c/code>.\u003c/p>\n\u003ch3>US-05 - сохранить учебную заявку\u003c/h3>\n\u003cp>\u003cstrong>Как\u003c/strong> заказчик, \u003cstrong>я хочу\u003c/strong> заполнить имя, компанию, email и набор, \u003cstrong>чтобы\u003c/strong> сохранить запрос для демонстрации.\u003c/p>\n\u003cul>\n\u003cli>AC1: Дано обязательные поля пусты. Когда нажата кнопка сохранения. Тогда отображаются ошибки у соответствующих полей.\u003c/li>\n\u003cli>AC2: Дано поля заполнены корректно и отмечено согласие. Когда заявка сохранена. Тогда она появляется в кабинете и остается после обновления страницы.\u003c/li>\n\u003cli>AC3: Дано форма успешно сохранена. Когда отображается статус. Тогда явно указано, что данные находятся только в этом браузере.\u003c/li>\n\u003c/ul>\n\u003cp>Связь: \u003ccode>MOD-301\u003c/code>, \u003ccode>MOD-302\u003c/code>.\u003c/p>\n\u003ch3>US-06 - контролировать локальные данные\u003c/h3>\n\u003cp>\u003cstrong>Как\u003c/strong> учебный менеджер, \u003cstrong>я хочу\u003c/strong> просмотреть, экспортировать и удалить заявки, \u003cstrong>чтобы\u003c/strong> контролировать демонстрационные данные.\u003c/p>\n\u003cul>\n\u003cli>AC1: Дано заявки есть в localStorage. Когда открыт кабинет. Тогда отображаются количество и список заявок.\u003c/li>\n\u003cli>AC2: Дано есть заявки. Когда нажата кнопка экспорта. Тогда скачивается JSON без обращения к сети.\u003c/li>\n\u003cli>AC3: Дано есть заявки. Когда пользователь удаляет запись или очищает данные. Тогда список обновляется, а удаленная запись не отображается.\u003c/li>\n\u003c/ul>\n\u003cp>Связь: \u003ccode>MOD-303\u003c/code>.\u003c/p>\n\u003ch2>Definition of Done\u003c/h2>\n\u003cp>История считается готовой, если выполнены все AC, результат проверен и отражен в backlog, а изменения приложения прошли CI. Публикация подтверждается действительным URL и успешным deploy. Если история требует внешнего сервиса, он должен быть настроен и проверен; pending означает незавершенный этап. Для пробных заявок используются тестовые данные.\u003c/p>\n\u003ch2>Публикация и связанные материалы\u003c/h2>\n\u003cp>\u003ca href=\"https://akov40320.github.io/modul-labs/\">Приложение\u003c/a> · \u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма\u003c/a> · \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37269189301\">CI и deploy\u003c/a>. \u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a> опубликована; \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a> содержит четыре проверенных низкодетализированных экрана; кликабельный прототип проверен. Отправка внешней формы проверена; критерии сохранения localStorage относятся к форме приложения. Внешняя форма проверяет общий диапазон 10–10000; приложение дополнительно применяет минимум выбранного набора 10 / 25 / 20.\u003c/p>\n\u003cp>\u003ca href=\"design/figma-prototype.md\">Проверенный прототип Figma и переходы\u003c/a>.\u003c/p>\n","wiki/Onboarding.md":"\u003ch1>Onboarding — запуск и доступы\u003c/h1>\n\u003ch2>Ссылки\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs\">Репозиторий\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://akov40320.github.io/modul-labs/\">Приложение\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://forms.yandex.ru/u/6ac336f295add59f2d7597ad\">Яндекс Форма\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/actions\">Actions\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/akov40320/modul-labs/pull/1\">PR №1\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a> опубликована. \u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a> создан; \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a> содержит проверенные макеты. Кликабельный прототип проверен; настройка доски проверена: 14 Done / 2 In Progress. Аккаунт GitHub: \u003ccode>akov40320\u003c/code>. Права других аккаунтов добавляются после получения логинов и подтверждения доступа. Пароли и токены в документации не хранятся.\u003c/p>\n\u003ch2>Запуск\u003c/h2>\n\u003col>\n\u003cli>Клонировать \u003ccode>https://github.com/akov40320/modul-labs.git\u003c/code>.\u003c/li>\n\u003cli>Перейти в папку \u003ccode>project\u003c/code>; использовать Node.js 22.\u003c/li>\n\u003cli>Запустить \u003ccode>npm run lint\u003c/code>, затем \u003ccode>npm test\u003c/code>.\u003c/li>\n\u003cli>Собрать приложение: \u003ccode>npm run build\u003c/code>.\u003c/li>\n\u003cli>Открыть приложение согласно \u003ca href=\"../project/README.md\">README проекта\u003c/a> либо воспользоваться опубликованной ссылкой.\u003c/li>\n\u003cli>Для изменений создать feature-ветку, связать задачу и открыть PR. Основная ветка защищена; перед merge должны пройти проверки.\u003c/li>\n\u003c/ol>\n\u003cp>Текущий проект не содержит внешних npm-зависимостей. При добавлении зависимостей команды установки и workflow обновляются вместе.\u003c/p>\n\u003ch2>Данные и проверка\u003c/h2>\n\u003cp>Для пробных отправок использовать тестовые значения. Форма приложения сохраняет данные в localStorage; кабинет позволяет просмотреть, экспортировать и удалить их. Это хранилище текущего браузера, а не серверная CRM. Яндекс Форма имеет отдельные ответы. Проверены ошибки обязательных полей и email, отклонение количества 9, успешная отправка количества 10 с пустым телефоном. Внешняя форма проверяет общий диапазон 10–10000; минимумы 25 и 20 указаны в выборе набора, а автоматическая проверка по выбранному набору реализована в приложении.\u003c/p>\n\u003cp>\u003ccode>hello@modul.example\u003c/code> — пример контактного адреса, не действующий канал связи. Не использовать его как адрес получателя уведомлений формы.\u003c/p>\n\u003ch2>Подтвержденное состояние на 05.10.2026\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a>: \u003cstrong>14 Done / 2 In Progress\u003c/strong>; активны MOD-EPIC-04 и MOD-403. WIP: In Progress 2, Review 1. Поля Priority, Role, Start date, Target date и Design link заполнены во всех 16 карточках.\u003c/p>\n\u003cp>\u003ca href=\"https://www.figma.com/proto/QJOUjnQiwxzXIUY2ATDpZm/%D0%9C%D0%BE%D0%B4%D1%83%D0%BB%D1%8C-%E2%80%94-MVP-%D0%BC%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%B8-%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D1%81%D0%BA%D0%B8%D0%B9-%D0%BF%D1%83%D1%82%D1%8C?node-id=1-105&t=QIxddXrGjI39AaY0-0&scaling=min-zoom&content-scaling=fixed&page-id=1%3A104&starting-point-node-id=1%3A105\">Figma-прототип\u003c/a>: каталог → форма → подтверждение → каталог; три перехода проверены. \u003ca href=\"https://github.com/akov40320/modul-labs/pull/18\">PR18\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/19\">PR19\u003c/a> и \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> объединены после успешного CI; конфликт PR20 разрешен. \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">Последующий CI и deploy\u003c/a> — SUCCESS, commit \u003ccode>978ac9bbe0ad52505ea03835505d67e0e404e722\u003c/code>.\u003c/p>\n","wiki/Team.md":"\u003ch1>Team — состав и роли команды\u003c/h1>\n\u003cp>Проект «Модуль» — B2B-лендинг с каталогом модульных конструкторов. Состав и зоны ответственности закреплены в таблице.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Участник\u003c/th>\n\u003cth>Роль\u003c/th>\n\u003cth>Зона ответственности\u003c/th>\n\u003cth>Контакт / доступ\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>А.А. Первых, группа 3Втба-1\u003c/td>\n\u003ctd>Team Lead / frontend\u003c/td>\n\u003ctd>Планирование, границы MVP, согласование решений, интерфейс и интеграция изменений\u003c/td>\n\u003ctd>GitHub: \u003ccode>akov40320\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Мария Волкова\u003c/td>\n\u003ctd>Аналитик / дизайн / QA\u003c/td>\n\u003ctd>User Stories, критерии приемки, User Flow, макеты, проверка сценариев\u003c/td>\n\u003ctd>Контакт и GitHub-логин не указаны\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Дмитрий Орлов\u003c/td>\n\u003ctd>Backend / DevOps\u003c/td>\n\u003ctd>Обработка заявок, интеграции, сборка, CI/CD и развертывание\u003c/td>\n\u003ctd>Контакт и GitHub-логин не указаны\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Работа с задачами\u003c/h2>\n\u003cul>\n\u003cli>GitHub Projects — рабочая доска проекта; GitHub Issues — задачи и подзадачи.\u003c/li>\n\u003cli>Поле \u003cstrong>«Роль»\u003c/strong> определяет функциональную ответственность: Team Lead, аналитик, дизайн, frontend, backend, QA или DevOps.\u003c/li>\n\u003cli>В поле \u003cstrong>Assignees\u003c/strong> пока используется подтвержденный GitHub-аккаунт \u003ccode>akov40320\u003c/code>. Другие аккаунты добавляются после получения логинов и проверки доступа.\u003c/li>\n\u003cli>Приглашения, принятие доступа, согласование макетов и результаты проверки фиксируются отдельными ссылками или комментариями после выполнения соответствующих действий.\u003c/li>\n\u003c/ul>\n\u003ch2>Правила взаимодействия\u003c/h2>\n\u003cp>Team Lead определяет приоритеты и проверяет соответствие задач MVP. Аналитика и дизайн готовят требования и макеты до начала разработки. После реализации карточка переходит в \u003cstrong>«На проверке»\u003c/strong>; результат проверяется по критериям приемки. Замечания записываются в issue, а исправление возвращает карточку в \u003cstrong>«В работе»\u003c/strong>. Статус \u003cstrong>«Готово»\u003c/strong> устанавливается после проверки результата и успешного CI, если задача меняет приложение.\u003c/p>\n\u003cp>Сведения о доступе и выполненных действиях дополняются по фактическим результатам. Репозиторий и приложение опубликованы: \u003ca href=\"https://github.com/akov40320/modul-labs\">GitHub\u003c/a> и \u003ca href=\"https://akov40320.github.io/modul-labs/\">Pages\u003c/a>. \u003ca href=\"https://github.com/akov40320/modul-labs/wiki\">Wiki\u003c/a> опубликована; \u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a> создан с 16 issues; \u003ca href=\"https://www.figma.com/design/QJOUjnQiwxzXIUY2ATDpZm/\">Figma\u003c/a> содержит проверенные макеты. Кликабельный прототип проверен; поля и статусы проверены: 14 Done / 2 In Progress.\u003c/p>\n\u003ch2>Подтвержденное состояние на 05.10.2026\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/users/akov40320/projects/1\">Project\u003c/a>: \u003cstrong>14 Done / 2 In Progress\u003c/strong>; активны MOD-EPIC-04 и MOD-403. WIP: In Progress 2, Review 1. Поля Priority, Role, Start date, Target date и Design link заполнены во всех 16 карточках.\u003c/p>\n\u003cp>\u003ca href=\"https://www.figma.com/proto/QJOUjnQiwxzXIUY2ATDpZm/%D0%9C%D0%BE%D0%B4%D1%83%D0%BB%D1%8C-%E2%80%94-MVP-%D0%BC%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%B8-%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D1%81%D0%BA%D0%B8%D0%B9-%D0%BF%D1%83%D1%82%D1%8C?node-id=1-105&t=QIxddXrGjI39AaY0-0&scaling=min-zoom&content-scaling=fixed&page-id=1%3A104&starting-point-node-id=1%3A105\">Figma-прототип\u003c/a>: каталог → форма → подтверждение → каталог; три перехода проверены. \u003ca href=\"https://github.com/akov40320/modul-labs/pull/18\">PR18\u003c/a>, \u003ca href=\"https://github.com/akov40320/modul-labs/pull/19\">PR19\u003c/a> и \u003ca href=\"https://github.com/akov40320/modul-labs/pull/20\">PR20\u003c/a> объединены после успешного CI; конфликт PR20 разрешен. \u003ca href=\"https://github.com/akov40320/modul-labs/actions/runs/37270869722\">Последующий CI и deploy\u003c/a> — SUCCESS, commit \u003ccode>978ac9bbe0ad52505ea03835505d67e0e404e722\u003c/code>.\u003c/p>\n"};

const nav=document.querySelector('#md-nav'),content=document.querySelector('#content');
function choose(key){
  document.querySelectorAll('#md-nav button').forEach(button=>button.classList.toggle('active',button.dataset.doc===key));
  content.innerHTML=pages[key];
  content.dataset.document=key;
}
Object.keys(pages).forEach((key,index)=>{
  const button=document.createElement('button');
  button.textContent=titles[key];button.dataset.doc=key;button.title=key;
  button.addEventListener('click',()=>choose(key));nav.append(button);
  if(index===0)choose(key);
});
content.addEventListener('click',event=>{
  const link=event.target.closest('a');if(!link)return;
  const href=link.getAttribute('href');if(!href||!pages[href.split('#')[0]])return;
  event.preventDefault();choose(href.split('#')[0]);
});
const artifactNav=document.querySelector('#artifact-nav');
artifacts.forEach(([href,label])=>{
  const link=document.createElement('a');link.href=href;link.textContent=label;
  link.target='_blank';link.rel='noopener noreferrer';artifactNav.append(link);
});
